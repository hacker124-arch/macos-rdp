name: Build qvm_soft.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build qvm_soft.exe
        working-directory: qvm_soft_src
        run: g++ -std=c++17 -O2 -Wall -Wextra -o qvm_soft.exe main.cpp cpu.cpp cpu_ext.cpp devices.cpp board.cpp

      - uses: actions/upload-artifact@v4
        with:
          name: qvm_soft
          path: qvm_soft_src/qvm_soft.exe
