name: Build whpx_hello.exe (Windows)

# Builds the Windows test program. The source file is inside this workflow,
# so this single file is all you need in the repo.
# Run it from Actions -> Build whpx_hello.exe -> Run workflow.
# Download the "whpx_hello" artifact, then run whpx_hello.exe on a Windows PC
# that has "Windows Hypervisor Platform" turned on.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Compile whpx_hello.exe
    runs-on: windows-2022
    steps:
      - name: Write the source file
        shell: pwsh
        run: |
          @'
          // whpx_hello.cpp
          // Milestone 1 for Quantum VM: create a VM with Windows Hypervisor Platform (WHPX),
          // run a tiny guest program that prints a message to a serial port, then halt.
          //
          // Requirements:
          //   - Windows 10/11 with "Windows Hypervisor Platform" turned on (Windows Features)
          //   - Virtualization enabled in BIOS/UEFI
          //   - Visual Studio 2022 with the C++ workload
          //
          // Build (open "x64 Native Tools Command Prompt for VS 2022"):
          //   cl /EHsc /std:c++17 whpx_hello.cpp WinHvPlatform.lib
          // Run:
          //   whpx_hello.exe

          #include <windows.h>
          #include <WinHvPlatform.h>

          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <vector>

          #define CHECK(hr, what)                                                    \
              do {                                                                   \
                  HRESULT _h = (hr);                                                 \
                  if (FAILED(_h)) {                                                  \
                      std::printf("%s failed: 0x%08lX\n", what, (unsigned long)_h); \
                      return 1;                                                      \
                  }                                                                  \
              } while (0)

          int main() {
              const UINT64 MEM_SIZE = 1024 * 1024;  // 1 MB of guest RAM, mapped at guest address 0
              const UINT64 GUEST_ENTRY = 0x1000;    // where the guest program is placed and starts

              // 1. Create the partition (the VM) with one virtual CPU.
              WHV_PARTITION_HANDLE part = nullptr;
              CHECK(WHvCreatePartition(&part), "WHvCreatePartition");

              UINT32 cpus = 1;
              CHECK(WHvSetPartitionProperty(part, WHvPartitionPropertyCodeProcessorCount,
                                            &cpus, sizeof(cpus)),
                    "WHvSetPartitionProperty");
              CHECK(WHvSetupPartition(part), "WHvSetupPartition");

              // 2. Give the VM its RAM.
              void* ram = VirtualAlloc(nullptr, MEM_SIZE, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
              if (!ram) {
                  std::printf("VirtualAlloc failed\n");
                  return 1;
              }
              CHECK(WHvMapGpaRange(part, ram, 0, MEM_SIZE,
                                   WHvMapGpaRangeFlagRead | WHvMapGpaRangeFlagWrite |
                                       WHvMapGpaRangeFlagExecute),
                    "WHvMapGpaRange");

              // 3. The guest program (16-bit real-mode machine code):
              //    mov dx, 0x3F8         ; COM1 serial port
              //    for each character:
              //        mov al, char      ; B0 ib
              //        out dx, al        ; EE
              //    hlt                   ; F4
              std::vector<uint8_t> code = {0xBA, 0xF8, 0x03};
              for (const char* p = "Hello from Quantum VM!\r\n"; *p; ++p) {
                  code.push_back(0xB0);
                  code.push_back(static_cast<uint8_t>(*p));
                  code.push_back(0xEE);
              }
              code.push_back(0xF4);
              std::memcpy(static_cast<uint8_t*>(ram) + GUEST_ENTRY, code.data(), code.size());

              // 4. Create the virtual CPU and set it to start in real mode at GUEST_ENTRY.
              CHECK(WHvCreateVirtualProcessor(part, 0, 0), "WHvCreateVirtualProcessor");

              auto segment = [](UINT16 selector, UINT16 attributes) {
                  WHV_X64_SEGMENT_REGISTER s = {};
                  s.Base = 0;
                  s.Limit = 0xFFFF;
                  s.Selector = selector;
                  s.Attributes = attributes;
                  return s;
              };

              WHV_REGISTER_NAME names[] = {
                  WHvX64RegisterCs, WHvX64RegisterDs, WHvX64RegisterEs, WHvX64RegisterSs,
                  WHvX64RegisterCr0, WHvX64RegisterRflags, WHvX64RegisterRip,
              };
              WHV_REGISTER_VALUE values[7] = {};
              values[0].Segment = segment(0, 0x9B);  // CS: code segment
              values[1].Segment = segment(0, 0x93);  // DS: data segment
              values[2].Segment = segment(0, 0x93);  // ES
              values[3].Segment = segment(0, 0x93);  // SS
              values[4].Reg64 = 0x10;                // CR0: real mode (protected mode bit off)
              values[5].Reg64 = 0x2;                 // RFLAGS: bit 1 must always be set
              values[6].Reg64 = GUEST_ENTRY;         // RIP: first instruction to run

              CHECK(WHvSetVirtualProcessorRegisters(part, 0, names, 7, values),
                    "WHvSetVirtualProcessorRegisters");

              // 5. Run the CPU. Each time the guest writes to the serial port, print the byte.
              //    Stop when the guest halts.
              std::printf("Starting VM...\n");
              for (;;) {
                  WHV_RUN_VP_EXIT_CONTEXT exit = {};
                  CHECK(WHvRunVirtualProcessor(part, 0, &exit, sizeof(exit)),
                        "WHvRunVirtualProcessor");

                  if (exit.ExitReason == WHvRunVpExitReasonX64IoPortAccess) {
                      const auto& io = exit.IoPortAccess;
                      if (io.PortNumber == 0x3F8 && io.AccessInfo.IsWrite) {
                          std::putchar(static_cast<int>(io.Rax & 0xFF));
                      }

                      // Skip past the OUT instruction. Otherwise the CPU would run it again.
                      WHV_REGISTER_NAME rip = WHvX64RegisterRip;
                      WHV_REGISTER_VALUE next = {};
                      next.Reg64 = exit.VpContext.Rip + exit.VpContext.InstructionLength;
                      CHECK(WHvSetVirtualProcessorRegisters(part, 0, &rip, 1, &next),
                            "advance RIP");
                  } else if (exit.ExitReason == WHvRunVpExitReasonX64Halt) {
                      std::printf("[guest halted]\n");
                      break;
                  } else {
                      std::printf("Unexpected VM exit, reason %d\n", (int)exit.ExitReason);
                      break;
                  }
              }

              // 6. Clean up.
              WHvDeletePartition(part);
              VirtualFree(ram, 0, MEM_RELEASE);
              return 0;
          }
          '@ | Set-Content -Encoding ascii whpx_hello.cpp

      - name: Set up the Visual C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        shell: cmd
        run: cl /EHsc /std:c++17 whpx_hello.cpp WinHvPlatform.lib /Fe:whpx_hello.exe

      - name: Show the file
        shell: pwsh
        run: Get-Item whpx_hello.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: whpx_hello
          path: whpx_hello.exe
          if-no-files-found: error
