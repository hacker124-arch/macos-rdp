- name: Start TCP Tunnel with Pinggy
        run: |
          nohup ssh -n -N -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:5900 tcp@free.pinggy.io > pinggy.log 2>&1 &
          echo "Establishing tunnel..."
          
          for i in {1..30}; do
            if grep -q "tcp://" pinggy.log 2>/dev/null; then
              break
            fi
            sleep 1
          done
          
          cat pinggy.log
          echo "Tunnel is active! Holding job open..."
          sleep 3600
