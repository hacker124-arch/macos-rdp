                              containerColor = QColors.Background,
                              titleContentColor = QColors.PrimaryLight,
                              navigationIconContentColor = QColors.PrimaryLight,
                              actionIconContentColor = QColors.PrimaryLight,
                          ),
                      )
                  },
              ) { pad ->
                  Column(Modifier.padding(pad).padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      Text(
                          "${vm.arch.label} · ${vm.cpus} vCPU · ${vm.ramMb} MB RAM · ${vm.diskGb} GB disk",
                          color = QColors.Muted,
                      )
                      if (!engineOk) {
                          Card(colors = CardDefaults.cardColors(containerColor = QColors.SurfaceHigh)) {
                              Text(
                                  "QEMU engine files are missing from this build (${vm.arch.qemuBinary}). " +
                                      "This VM cannot start until they are added. See the Engine screen.",
                                  color = QColors.Danger, fontSize = 13.sp, modifier = Modifier.padding(12.dp),
                              )
                          }
                      }
                      if (session != null && vm.isServer) {
                          OutlinedButton(onClick = { showCreds = true }, modifier = Modifier.fillMaxWidth()) {
                              Icon(Icons.Default.Link, null); Spacer(Modifier.width(8.dp))
                              Text("Show URL and login")
                          }
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          Button(
                              onClick = { VmService.start(context, vm.id) },
                              enabled = !isRunning,
                              colors = ButtonDefaults.buttonColors(containerColor = QColors.Primary),
                              modifier = Modifier.weight(1f),
                          ) { Icon(Icons.Default.PlayArrow, null); Spacer(Modifier.width(6.dp)); Text("Start") }
                          Button(
                              onClick = { VmService.stop(context, vm.id) },
                              enabled = isRunning,
                              colors = ButtonDefaults.buttonColors(containerColor = QColors.Danger),
                              modifier = Modifier.weight(1f),
                          ) { Icon(Icons.Default.Stop, null); Spacer(Modifier.width(6.dp)); Text("Stop") }
                          OutlinedButton(onClick = { QemuEngine.clearLog(vm.id) }) { Text("Clear") }
                      }

                      // Screen of the running VM
                      // Servers show their screen on the web page only; local VMs show it here.
                      if (session != null && isRunning && !vm.isServer) {
                          key(session.localUrl, session.localToken) { LocalDisplay(session) }
                      }

                      // Serial console
                      Box(
                          Modifier.weight(1f).fillMaxWidth()
                              .clip(RoundedCornerShape(14.dp))
                              .background(QColors.Terminal)
                              .border(1.dp, QColors.SurfaceHigh, RoundedCornerShape(14.dp))
                              .padding(10.dp)
                      ) {
                          if (lines.isEmpty()) {
                              Text("Serial console output appears here.", color = QColors.Muted, fontSize = 13.sp)
                          } else LazyColumn(state = listState) {
                              items(lines.size) { i ->
                                  Text(
                                      lines[i], color = QColors.PrimaryLight,
                                      fontFamily = FontFamily.Monospace, fontSize = 11.sp, lineHeight = 14.sp,
                                  )
                              }
                          }
                      }

                      Row(verticalAlignment = Alignment.CenterVertically) {
                          OutlinedTextField(
                              value = input, onValueChange = { input = it },
                              placeholder = { Text("Send to guest serial console") },
                              singleLine = true, enabled = isRunning, modifier = Modifier.weight(1f),
                          )
                          IconButton(
                              onClick = { QemuEngine.sendInput(vm.id, input); input = "" },
                              enabled = isRunning && input.isNotEmpty(),
                          ) { Icon(Icons.Default.Send, "Send", tint = QColors.Primary) }
                      }
                  }
              }
          }

          // ---------------------------------------------------------------- Engine

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun EngineScreen(onBack: () -> Unit) {
              val context = LocalContext.current
              val status = remember { QemuEngine.engineStatus(context) }
              Scaffold(
                  containerColor = QColors.Background,
                  topBar = {
                      TopAppBar(
                          title = { Text("QEMU engine") },
                          navigationIcon = { IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, "Back") } },
                          colors = TopAppBarDefaults.topAppBarColors(
                              containerColor = QColors.Background,
                              titleContentColor = QColors.PrimaryLight,
                              navigationIconContentColor = QColors.PrimaryLight,
                          ),
                      )
                  },
              ) { pad ->
                  Column(Modifier.padding(pad).padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      Text("Bundled binaries", color = QColors.Muted)
                      status.forEach { (name, ok) ->
                          Card(colors = CardDefaults.cardColors(containerColor = QColors.Surface)) {
                              Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Text(name, Modifier.weight(1f), fontFamily = FontFamily.Monospace)
                                  Text(
                                      if (ok) "Ready" else "Missing",
                                      color = if (ok) QColors.Success else QColors.Danger,
                                      fontWeight = FontWeight.SemiBold,
                                  )
                              }
                          }
                      }
                      Text(
                          "Emulation uses QEMU's TCG engine (software CPU emulation), so guests run " +
                              "slower than on a PC. Use lightweight guests for best results.",
                          color = QColors.Muted, fontSize = 13.sp,
                      )
                  }
              }
          }


          // ---------------------------------------------------------------- Servers

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun ServersScreen(
              servers: List<VmConfig>, onCreate: () -> Unit, onOpen: (VmConfig) -> Unit, onBack: () -> Unit,
          ) {
              val running by QemuEngine.running.collectAsStateWithLifecycle()
              Scaffold(
                  containerColor = QColors.Background,
                  topBar = {
                      TopAppBar(
                          title = { Text("Servers") },
                          navigationIcon = { IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, "Back") } },
                          colors = TopAppBarDefaults.topAppBarColors(
                              containerColor = QColors.Background,
                              titleContentColor = QColors.PrimaryLight,
                              navigationIconContentColor = QColors.PrimaryLight,
                          ),
                      )
                  },
                  floatingActionButton = {
                      ExtendedFloatingActionButton(
                          onClick = onCreate, containerColor = QColors.Primary,
                          contentColor = androidx.compose.ui.graphics.Color.White,
                          icon = { Icon(Icons.Default.Add, null) }, text = { Text("New server") },
                      )
                  },
              ) { pad ->
                  Column(Modifier.fillMaxSize().padding(pad).padding(horizontal = 16.dp)) {
                      Text(
                          "A server is a VM you can open from any other device. Start it and the app shows a " +
                              "web address plus a username and password. Open the address in a browser on a " +
                              "device on the same Wi-Fi and sign in.",
                          color = QColors.Muted, fontSize = 13.sp, modifier = Modifier.padding(vertical = 8.dp),
                      )
                      if (servers.isEmpty()) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("No servers yet", color = QColors.Muted)
                          }
                      } else LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          items(servers, key = { it.id }) { VmCard(it, it.id in running) { onOpen(it) } }
                          item { Spacer(Modifier.height(80.dp)) }
                      }
                  }
              }
          }

          @Composable
          private fun ConnectionDialog(session: ServerSession, onDismiss: () -> Unit) {
              val clipboard = androidx.compose.ui.platform.LocalClipboardManager.current
              fun copy(t: String) = clipboard.setText(androidx.compose.ui.text.AnnotatedString(t))
              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = QColors.Surface,
                  title = { Text("Server is starting") },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          Text("Open this address on your other device, then enter the username and password you chose.", color = QColors.Muted)
                          CredRow("URL", session.url) { copy(session.url) }
                          CredRow("Username", session.username) { copy(session.username) }
                          CredRow("Password", session.password) { copy(session.password) }
                          Text(
                              "Both devices must be on the same network.",
                              color = QColors.Muted, fontSize = 12.sp,
                          )
                      }
                  },
                  confirmButton = { TextButton(onClick = onDismiss) { Text("Done") } },
              )
          }

          @Composable
          private fun CredRow(label: String, value: String, onCopy: () -> Unit) {
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Column(Modifier.weight(1f)) {
                      Text(label, color = QColors.Muted, fontSize = 12.sp)
                      Text(value, fontFamily = FontFamily.Monospace, color = QColors.PrimaryLight, fontSize = 15.sp)
                  }
                  IconButton(onClick = onCopy) { Icon(Icons.Default.ContentCopy, "Copy $label", tint = QColors.Primary) }
              }
          }


          // ---------------------------------------------------------------- Display

          @Composable
          private fun LocalDisplay(session: ServerSession) {
              AndroidView(
                  modifier = Modifier.fillMaxWidth().height(260.dp).clip(RoundedCornerShape(14.dp)),
                  factory = { ctx ->
                      WebView(ctx).apply {
                          settings.javaScriptEnabled = true
                          settings.domStorageEnabled = true
                          webViewClient = WebViewClient()
                          // Log the WebView in with the token issued for this run (no typed password needed).
                          CookieManager.getInstance().apply {
                              setAcceptCookie(true)
                              setCookie(session.localUrl, "qvm=${session.localToken}; Path=/")
                              flush()
                          }
                          loadUrl("${session.localUrl}/viewer")
                      }
                  },
              )
          }
          QVM_EOF
          mkdir -p app/src/main/java/com/quantumvm/app/ui
          cat > app/src/main/java/com/quantumvm/app/ui/Theme.kt <<'QVM_EOF'
          package com.quantumvm.app.ui

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          object QColors {
              val Background = Color(0xFF120A1F)
              val Surface = Color(0xFF1B0F33)
              val SurfaceHigh = Color(0xFF2A1850)
              val Primary = Color(0xFF9B5CFF)
              val PrimaryLight = Color(0xFFC9A7FF)
              val OnSurface = Color(0xFFEDE3FF)
              val Muted = Color(0xFF9D8BBF)
              val Success = Color(0xFF6EE7A8)
              val Danger = Color(0xFFFF6B8B)
              val Terminal = Color(0xFF0B0615)
          }

          private val Scheme = darkColorScheme(
              primary = QColors.Primary,
              onPrimary = Color.White,
              primaryContainer = QColors.SurfaceHigh,
              onPrimaryContainer = QColors.PrimaryLight,
              secondary = QColors.PrimaryLight,
              background = QColors.Background,
              onBackground = QColors.OnSurface,
              surface = QColors.Surface,
              onSurface = QColors.OnSurface,
              surfaceVariant = QColors.SurfaceHigh,
              onSurfaceVariant = QColors.Muted,
              error = QColors.Danger,
              outline = QColors.Muted,
          )

          @Composable
          fun QuantumTheme(content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = Scheme, content = content)
          }
          QVM_EOF
          echo "Generated project files:"
          find . -type f | sort

      - name: Put engine files into the app
        working-directory: qvm
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/qemu
          cp "$GITHUB_WORKSPACE"/engine-out/jniLibs/arm64-v8a/* app/src/main/jniLibs/arm64-v8a/
          cp -r "$GITHUB_WORKSPACE"/engine-out/assets/qemu/* app/src/main/assets/qemu/ || true
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: qvm
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: QuantumVM-apk
          path: qvm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
