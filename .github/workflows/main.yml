name: Build Quantum VM firmware (UEFI with our logo)

# Builds open-source UEFI firmware (EDK2 / OVMF) with the Quantum VM logo on the
# boot splash screen. Run it from Actions -> Build Quantum VM firmware -> Run workflow.
# Download the "quantumvm-firmware" artifact: OVMF_CODE.fd and OVMF_VARS.fd.

on:
  workflow_dispatch:

jobs:
  firmware:
    name: Build UEFI firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev nasm acpica-tools \
            python3 git librsvg2-bin imagemagick

      - name: Get EDK2 (stable release)
        run: |
          git clone --depth 1 --branch edk2-stable202411 --recurse-submodules --shallow-submodules \
            https://github.com/tianocore/edk2.git edk2
          cd edk2 && git log -1 --oneline

      - name: Write the Quantum VM logo
        run: |
          cat > quantum_vm_logo.svg <<'QVM_SVG'
          <?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#2A1850"/>
                <stop offset="1" stop-color="#120A1F"/>
              </linearGradient>
              <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#C9A7FF"/>
                <stop offset="1" stop-color="#9B5CFF"/>
              </linearGradient>
              <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0" stop-color="#9B5CFF" stop-opacity="0.55"/>
                <stop offset="1" stop-color="#9B5CFF" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <!-- Rounded app background -->
            <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>

            <!-- Soft glow behind the chip -->
            <circle cx="512" cy="512" r="380" fill="url(#glow)"/>

            <!-- Chip pins (top, bottom, left, right) -->
            <g stroke="#C9A7FF" stroke-width="28" stroke-linecap="round" opacity="0.9">
              <line x1="400" y1="150" x2="400" y2="250"/>
              <line x1="512" y1="150" x2="512" y2="250"/>
              <line x1="624" y1="150" x2="624" y2="250"/>
              <line x1="400" y1="774" x2="400" y2="874"/>
              <line x1="512" y1="774" x2="512" y2="874"/>
              <line x1="624" y1="774" x2="624" y2="874"/>
              <line x1="150" y1="400" x2="250" y2="400"/>
              <line x1="150" y1="512" x2="250" y2="512"/>
              <line x1="150" y1="624" x2="250" y2="624"/>
              <line x1="774" y1="400" x2="874" y2="400"/>
              <line x1="774" y1="512" x2="874" y2="512"/>
              <line x1="774" y1="624" x2="874" y2="624"/>
            </g>

            <!-- Chip body -->
            <rect x="250" y="250" width="524" height="524" rx="88" fill="#1B0F33" stroke="url(#chip)" stroke-width="30"/>

            <!-- Inner core: a "Q" ring with a tail -->
            <circle cx="500" cy="490" r="130" fill="none" stroke="url(#chip)" stroke-width="54"/>
            <line x1="570" y1="560" x2="650" y2="640" stroke="url(#chip)" stroke-width="54" stroke-linecap="round"/>

            <!-- Power dot -->
            <circle cx="650" cy="650" r="0" fill="#6EE7A8"/>
          </svg>
          QVM_SVG

      - name: Replace the boot splash logo
        run: |
          set -e
          LOGO_DIR=edk2/MdeModulePkg/Logo
          test -d "$LOGO_DIR" || { echo "Logo folder not found in EDK2"; ls edk2/MdeModulePkg; exit 1; }
          # 200x200 image on the same dark background as the app
          rsvg-convert -w 200 -h 200 quantum_vm_logo.svg -o logo.png
          convert logo.png -background '#120A1F' -flatten -type TrueColor BMP3:"$LOGO_DIR/Logo.bmp"
          file "$LOGO_DIR/Logo.bmp"

      - name: Build OVMF (x64 UEFI firmware)
        working-directory: edk2
        run: |
          set -e
          source edksetup.sh
          make -C BaseTools -j"$(nproc)"
          build -a X64 -t GCC5 -b RELEASE -p OvmfPkg/OvmfPkgX64.dsc -n "$(nproc)"

      - name: Collect the firmware files
        run: |
          mkdir -p firmware-out
          FV=edk2/Build/OvmfX64/RELEASE_GCC5/FV
          cp "$FV/OVMF_CODE.fd" "$FV/OVMF_VARS.fd" firmware-out/
          ls -la firmware-out

      - uses: actions/upload-artifact@v4
        with:
          name: quantumvm-firmware
          path: firmware-out
          if-no-files-found: error
