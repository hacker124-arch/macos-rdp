name: macos-vm
on: workflow_dispatch

jobs:
  vm:
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
    steps:
      - name: Grant permissions and enable VNC
        run: |
          PW="${VNC_PASSWORD:0:8}"
          echo "VNC password length used: ${#PW}"

          nohup caffeinate -dimsu > /dev/null 2>&1 &
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true

          # Try to grant Screen Recording / Accessibility to the sharing agents
          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          for CLIENT in com.apple.screensharing.agent com.apple.RemoteDesktopAgent /usr/libexec/screensharingd; do
            if [[ "$CLIENT" == /* ]]; then TYPE=1; else TYPE=0; fi
            for SERVICE in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServicePostEvent; do
              sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('$SERVICE','$CLIENT',$TYPE,2,4,1);" 2>&1 \
                && echo "TCC OK: $SERVICE $CLIENT" || echo "TCC FAILED: $SERVICE $CLIENT"
            done
          done

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$PW" \
            -restart -agent -privs -all || true

          sudo killall screensharingd 2>/dev/null || true
          sleep 5

          echo "---- console user ----"
          stat -f%Su /dev/console || true
          echo "---- screen capture test ----"
          screencapture -x /tmp/test.png && ls -l /tmp/test.png || echo "screencapture FAILED"
          sudo lsof -iTCP:5900 -sTCP:LISTEN || echo "WARNING: VNC NOT LISTENING ON 5900"

      - name: Start bore tunnel
        run: |
          brew install bore-cli
          nohup bore local 5900 --to bore.pub > bore.log 2>&1 &
          sleep 8
          echo "---- bore log ----"
          cat bore.log
          echo "---- CONNECT TIGHTVNC TO THIS ----"
          grep -o 'bore.pub:[0-9]*' bore.log | head -1 || echo "No tunnel found, check log above"

      - name: Keep alive
        run: sleep 21000
