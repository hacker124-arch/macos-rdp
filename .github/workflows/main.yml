name: Build QEMU engine

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Download Termux QEMU packages
        run: |
          set -e
          BASE=https://packages.termux.dev/apt/termux-main
          mkdir -p work/debs work/root out
          CURL="curl -fL --connect-timeout 20 --max-time 900 --retry 3 --retry-delay 5 --progress-bar"
          echo "Fetching package index..."
          $CURL "$BASE/dists/stable/main/binary-aarch64/Packages" -o work/Packages
          ls -lh work/Packages
          for pkg in qemu-system-x86-64-headless qemu-system-aarch64-headless qemu-utils; do
            f=$(awk -v p="$pkg" '$1=="Package:"{cur=$2} $1=="Filename:" && cur==p {print $2; exit}' work/Packages)
            if [ -z "$f" ]; then echo "Package $pkg not found in index"; exit 1; fi
            echo "Downloading $pkg from $f"
            $CURL "$BASE/$f" -o "work/debs/$pkg.deb"
            ls -lh "work/debs/$pkg.deb"
          done

      - name: Extract packages
        run: |
          for d in work/debs/*.deb; do dpkg-deb -x "$d" work/root; done
          find work/root -type f | head -50

      - name: Collect binaries and firmware
        run: |
          set -e
          B=work/root/data/data/com.termux/files/usr
          mkdir -p out/firmware
          cp "$B/bin/qemu-system-x86_64"  out/libqemu-system-x86_64.so
          cp "$B/bin/qemu-system-aarch64" out/libqemu-system-aarch64.so
          cp "$B/bin/qemu-img"            out/libqemu-img.so
          chmod 755 out/*.so

          # Firmware can sit in different folders depending on the package,
          # so search for it instead of assuming one path.
          FW=$(find work/root -type d -path '*share/qemu' | head -1)
          if [ -n "$FW" ]; then
            cp -r "$FW/." out/firmware/
            echo "Firmware copied from $FW"
          else
            echo "WARNING: no share/qemu folder found; firmware not included"
          fi
          ls -lh out/firmware || true
          (cd out/firmware && zip -qr ../qemu-firmware.zip .) || echo "No firmware to zip"

      - name: Report missing shared libraries
        run: |
          B=work/root/data/data/com.termux/files/usr
          for bin in out/*.so; do
            echo "== $bin"
            readelf -d "$bin" | grep NEEDED || true
          done
          echo "Libraries under $B/lib:"
          ls "$B/lib" | grep '\.so' | head -100 || true

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-engine
          path: |
            out/*.so
            out/qemu-firmware.zip
