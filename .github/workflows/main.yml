name: Build Quantum OS ISO

on:
  workflow_dispatch:      # click "Run workflow" on the Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder
        run: |
          B="$(find . -name build.sh -not -path './.git/*' | head -n 1)"
          if [ -z "$B" ]; then
            echo "build.sh was not found in the repository. Files present:"
            find . -not -path './.git/*' -type f | head -n 60
            exit 1
          fi
          echo "PROJECT_DIR=$(cd "$(dirname "$B")" && pwd)" >> "$GITHUB_ENV"
          echo "Found project in: $(dirname "$B")"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex gawk texinfo m4 patch perl python3 \
            wget gnupg xz-utils bzip2 cpio rsync squashfs-tools xorriso mtools dosfstools \
            grub-common grub-pc-bin grub-efi-amd64-bin bc libssl-dev libelf-dev dwarves \
            qemu-system-x86 ovmf

      - name: Build Quantum OS
        run: |
          cd "$PROJECT_DIR"
          bash build.sh

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quantum-os-iso
          path: |
            ${{ env.PROJECT_DIR }}/out/*.iso
            ${{ env.PROJECT_DIR }}/out/*.sha256

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ env.PROJECT_DIR }}/logs/
