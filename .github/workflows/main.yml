          package com.quantumvm.app.engine

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import com.quantumvm.app.MainActivity
          import com.quantumvm.app.data.VmRepository
          import android.app.PendingIntent

          /** Foreground service that keeps VMs alive while the app is in the background. */
          class VmService : Service() {

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_START -> {
                          val id = intent.getStringExtra(EXTRA_VM_ID) ?: return START_NOT_STICKY
                          val repo = VmRepository(this)
                          val vm = repo.get(id) ?: return START_NOT_STICKY
                          startForeground(
                              NOTIF_ID, buildNotification("Running ${vm.name}"),
                              ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                          )
                          QemuEngine.start(this, vm, repo)
                          watchForExit()
                      }
                      ACTION_STOP -> {
                          intent.getStringExtra(EXTRA_VM_ID)?.let(QemuEngine::stop)
                      }
                  }
                  return START_NOT_STICKY
              }

              private fun watchForExit() {
                  Thread {
                      // Poll until no VM is running, then shut the service down.
                      Thread.sleep(2000)
                      while (QemuEngine.running.value.isNotEmpty()) Thread.sleep(1000)
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                  }.start()
              }

              private fun buildNotification(text: String): Notification {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL, "Virtual machines", NotificationManager.IMPORTANCE_LOW)
                  )
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, CHANNEL)
                      .setContentTitle("Quantum VM")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentIntent(open)
                      .setOngoing(true)
                      .build()
              }

              companion object {
                  private const val CHANNEL = "vm_running"
                  private const val NOTIF_ID = 1
                  const val ACTION_START = "com.quantumvm.START"
                  const val ACTION_STOP = "com.quantumvm.STOP"
                  const val EXTRA_VM_ID = "vm_id"

                  fun start(context: Context, vmId: String) {
                      context.startForegroundService(
                          Intent(context, VmService::class.java)
                              .setAction(ACTION_START).putExtra(EXTRA_VM_ID, vmId)
                      )
                  }

                  fun stop(context: Context, vmId: String) {
                      context.startService(
                          Intent(context, VmService::class.java)
                              .setAction(ACTION_STOP).putExtra(EXTRA_VM_ID, vmId)
                      )
                  }
              }
          }
