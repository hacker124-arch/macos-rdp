          package com.quantumvm.app.engine

          import android.content.Context
          import fi.iki.elonen.NanoHTTPD.IHTTPSession
          import fi.iki.elonen.NanoHTTPD.Method
          import fi.iki.elonen.NanoHTTPD.Response
          import fi.iki.elonen.NanoHTTPD.newChunkedResponse
          import fi.iki.elonen.NanoHTTPD.newFixedLengthResponse
          import fi.iki.elonen.NanoWSD
          import fi.iki.elonen.NanoWSD.WebSocket
          import fi.iki.elonen.NanoWSD.WebSocketFrame
          import fi.iki.elonen.NanoWSD.WebSocketFrame.CloseCode
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.update
          import java.io.IOException
          import java.net.Inet4Address
          import java.net.InetAddress
          import java.net.NetworkInterface
          import java.net.ServerSocket
          import java.net.Socket
          import java.security.MessageDigest
          import java.security.SecureRandom
          import java.util.Base64

          data class ServerSession(
              val url: String,
              val localUrl: String,
              val username: String,
              val password: String,
              val httpPort: Int,
              val vncPort: Int,
              val localToken: String,
          )

          /**
           * Remote access for "server" VMs. Each running server gets a small web gateway:
           *  - a login page (random username + password generated on every start)
           *  - a browser VNC client served from assets/web/viewer.html
           *  - a WebSocket bridge to QEMU's VNC display (bound to 127.0.0.1 only)
           * Nothing but the gateway port is reachable from the network, and the VNC bridge
           * refuses connections that do not carry a session cookie from a successful login.
           */
          object RemoteAccess {

              private val _sessions = MutableStateFlow<Map<String, ServerSession>>(emptyMap())
              val sessions: StateFlow<Map<String, ServerSession>> = _sessions

              private val gateways = HashMap<String, Gateway>()
              private val rnd = SecureRandom()

              private const val USER_ALPHABET = "23456789"
              private const val PASS_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"

              private fun random(len: Int, alphabet: String) =
                  (1..len).map { alphabet[rnd.nextInt(alphabet.length)] }.joinToString("")

              @Synchronized
              fun start(
                  context: Context, vmId: String, local: Boolean = false,
                  username: String? = null, password: String? = null,
              ): ServerSession {
                  stop(vmId)
                  val vncPort = freePort(5901, 5999, loopbackOnly = true)
                  // Local VMs listen on loopback only; servers listen on the network.
                  val httpPort = freePort(8080, 8180, loopbackOnly = local)
                  // Use the login the user chose; generate one only if none was set.
                  val user = username?.takeIf { it.isNotBlank() } ?: ("vm" + random(4, USER_ALPHABET))
                  val pass = password?.takeIf { it.isNotBlank() } ?: random(12, PASS_ALPHABET)

                  val gateway = Gateway(context.applicationContext, httpPort, user, pass, vncPort, local)
                  gateway.start(0, true)
                  gateways[vmId] = gateway

                  val host = if (local) "127.0.0.1" else (localIp() ?: "<phone-ip>")
                  val session = ServerSession(
                      url = "http://$host:$httpPort",
                      localUrl = "http://127.0.0.1:$httpPort",
                      username = user, password = pass, httpPort = httpPort, vncPort = vncPort,
                      localToken = gateway.issueToken(),
                  )
                  _sessions.update { it + (vmId to session) }
                  return session
              }

              @Synchronized
              fun stop(vmId: String) {
                  gateways.remove(vmId)?.stop()
                  _sessions.update { it - vmId }
              }

              private fun freePort(from: Int, to: Int, loopbackOnly: Boolean): Int {
                  for (p in from..to) {
                      try {
                          val addr = if (loopbackOnly) InetAddress.getByName("127.0.0.1") else null
                          ServerSocket(p, 0, addr).use { return p }
                      } catch (_: IOException) { /* in use, try next */ }
                  }
                  error("No free port in $from..$to")
              }

              /** Best guess at the phone's address on the Wi-Fi / hotspot network. */
              fun localIp(): String? {
                  val found = runCatching {
                      NetworkInterface.getNetworkInterfaces().toList()
                          .filter { it.isUp && !it.isLoopback }
                          .flatMap { ni ->
                              ni.inetAddresses.toList()
                                  .filterIsInstance<Inet4Address>()
                                  .filter { !it.isLoopbackAddress && it.isSiteLocalAddress }
                                  .map { ni.name to it.hostAddress!! }
                          }
                  }.getOrDefault(emptyList())
                  return (found.firstOrNull { (n, _) ->
                      n.startsWith("wlan") || n.startsWith("ap") || n.startsWith("swlan")
                  } ?: found.firstOrNull())?.second
              }

              // ------------------------------------------------------------------ gateway

              private class Gateway(
                  private val context: Context,
                  port: Int,
                  private val username: String,
                  private val password: String,
                  private val vncPort: Int,
                  loopbackOnly: Boolean,
              ) : NanoWSD(if (loopbackOnly) "127.0.0.1" else null, port) {

                  private val tokens = HashSet<String>()
                  private val failures = HashMap<String, Pair<Int, Long>>() // ip -> (count, firstFailMillis)
                  private val rng = SecureRandom()

                  override fun serveHttp(session: IHTTPSession): Response {
                      val uri = session.uri
                      return when {
                          uri == "/" && session.method == Method.GET ->
                              if (isAuthed(session)) redirect("/viewer") else asset("web/login.html")
                          uri == "/login" && session.method == Method.POST -> login(session)
                          uri == "/viewer" ->
                              if (isAuthed(session)) asset("web/viewer.html") else redirect("/")
                          else -> newFixedLengthResponse(Response.Status.NOT_FOUND, "text/plain", "Not found")
                      }
                  }

                  override fun openWebSocket(handshake: IHTTPSession): WebSocket =
                      VncBridge(handshake, isAuthed(handshake))

                  // ---- auth

                  private fun login(session: IHTTPSession): Response {
                      val ip = session.remoteIpAddress ?: "?"
                      if (lockedOut(ip)) return redirect("/?e=2")
                      runCatching { session.parseBody(HashMap()) }
                      val u = session.parms["u"] ?: ""
                      val p = session.parms["p"] ?: ""
                      val ok = safeEquals(u, username) and safeEquals(p, password)
                      if (!ok) {
                          recordFailure(ip)
                          return redirect("/?e=1")
                      }
                      clearFailures(ip)
                      val token = issueToken()
                      return redirect("/viewer", "qvm=$token; Path=/; HttpOnly; SameSite=Strict")
                  }

                  fun issueToken(): String {
                      val bytes = ByteArray(24).also { rng.nextBytes(it) }
                      val token = Base64.getUrlEncoder().withoutPadding().encodeToString(bytes)
                      synchronized(tokens) { tokens.add(token) }
                      return token
                  }

                  private fun isAuthed(session: IHTTPSession): Boolean {
                      val cookie = session.headers["cookie"] ?: return false
                      val token = cookie.split(";").map { it.trim() }
                          .firstOrNull { it.startsWith("qvm=") }?.removePrefix("qvm=") ?: return false
                      return synchronized(tokens) { token in tokens }
                  }

                  private fun safeEquals(a: String, b: String) =
                      MessageDigest.isEqual(a.toByteArray(), b.toByteArray())

                  @Synchronized private fun lockedOut(ip: String): Boolean {
                      val (count, since) = failures[ip] ?: return false
                      if (System.currentTimeMillis() - since > 60_000) { failures.remove(ip); return false }
                      return count >= 5
                  }

                  @Synchronized private fun recordFailure(ip: String) {
                      val now = System.currentTimeMillis()
                      val (count, since) = failures[ip] ?: (0 to now)
                      failures[ip] = if (now - since > 60_000) 1 to now else (count + 1) to since
                  }

                  @Synchronized private fun clearFailures(ip: String) { failures.remove(ip) }

                  // ---- responses

                  private fun redirect(to: String, cookie: String? = null): Response =
                      newFixedLengthResponse(Response.Status.REDIRECT_SEE_OTHER, "text/plain", "").apply {
                          addHeader("Location", to)
                          addHeader("Cache-Control", "no-store")
                          cookie?.let { addHeader("Set-Cookie", it) }
                      }

                  private fun asset(path: String): Response = try {
                      newChunkedResponse(Response.Status.OK, "text/html; charset=utf-8", context.assets.open(path))
                          .apply { addHeader("Cache-Control", "no-store") }
                  } catch (_: IOException) {
                      newFixedLengthResponse(Response.Status.NOT_FOUND, "text/plain", "Not found")
                  }

                  // ---- websocket <-> VNC TCP bridge

                  private inner class VncBridge(handshake: IHTTPSession, private val authed: Boolean) :
                      WebSocket(handshake) {

                      @Volatile private var socket: Socket? = null

                      override fun onOpen() {
                          if (!authed) {
                              runCatching { close(CloseCode.PolicyViolation, "unauthorized", false) }
                              return
                          }
                          try {
                              val s = Socket("127.0.0.1", vncPort).apply { tcpNoDelay = true }
                              socket = s
                              Thread {
                                  try {
                                      val buf = ByteArray(32 * 1024)
                                      val input = s.getInputStream()
                                      while (true) {
                                          val n = input.read(buf)
                                          if (n < 0) break
                                          send(buf.copyOf(n))
                                      }
                                  } catch (_: IOException) {
                                  } finally {
                                      runCatching { close(CloseCode.NormalClosure, "vnc closed", false) }
                                  }
                              }.apply { isDaemon = true }.start()
                          } catch (_: IOException) {
                              runCatching { close(CloseCode.InternalServerError, "vm not ready", false) }
                          }
                      }

                      override fun onMessage(message: WebSocketFrame) {
                          try {
                              socket?.getOutputStream()?.apply { write(message.binaryPayload); flush() }
                          } catch (_: IOException) {
                              runCatching { close(CloseCode.InternalServerError, "write failed", false) }
                          }
                      }

                      override fun onClose(code: CloseCode?, reason: String?, initiatedByRemote: Boolean) {
                          runCatching { socket?.close() }
                      }

                      override fun onPong(pong: WebSocketFrame?) {}

                      override fun onException(exception: IOException?) {
                          runCatching { socket?.close() }
                      }
                  }
              }
          }
