          sealed interface Screen {
              data object Home : Screen
              data class Create(val server: Boolean) : Screen
              data object Servers : Screen
              data object Engine : Screen
              data class Detail(val id: String) : Screen
          }

          @Composable
          fun QuantumApp() {
              val context = LocalContext.current
              val repo = remember { VmRepository(context) }
              var screen by remember { mutableStateOf<Screen>(Screen.Home) }
              var vms by remember { mutableStateOf(repo.list()) }
              fun refresh() { vms = repo.list() }

              when (val s = screen) {
                  Screen.Home -> HomeScreen(
                      vms = vms.filter { !it.isServer },
                      onCreate = { screen = Screen.Create(false) },
                      onOpen = { screen = Screen.Detail(it.id) },
                      onEngine = { screen = Screen.Engine },
                      onServers = { screen = Screen.Servers },
                  )
                  Screen.Servers -> ServersScreen(
                      servers = vms.filter { it.isServer },
                      onCreate = { screen = Screen.Create(true) },
                      onOpen = { screen = Screen.Detail(it.id) },
                      onBack = { screen = Screen.Home },
                  )
                  is Screen.Create -> CreateScreen(
                      server = s.server,
                      repo = repo,
                      onDone = { refresh(); screen = if (s.server) Screen.Servers else Screen.Home },
                      onBack = { screen = if (s.server) Screen.Servers else Screen.Home },
                  )
                  Screen.Engine -> EngineScreen(onBack = { screen = Screen.Home })
                  is Screen.Detail -> {
                      val vm = vms.firstOrNull { it.id == s.id }
                      if (vm == null) screen = Screen.Home else DetailScreen(
                          vm = vm,
                          onBack = { screen = if (vm.isServer) Screen.Servers else Screen.Home },
                          onDelete = { repo.delete(vm.id); refresh(); screen = if (vm.isServer) Screen.Servers else Screen.Home },
                      )
                  }
              }
          }

