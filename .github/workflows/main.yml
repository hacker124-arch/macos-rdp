name: macOS Remote Desktop

on:
  workflow_dispatch:

jobs:
  macos-rdp:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure User and Enable Screen Sharing
        run: |
          sudo dscl . -create /Users/runneradmin UserShell /bin/bash || true
          sudo dscl . -create /Users/runneradmin RealName "Runner Admin" || true
          sudo dseditgroup -o edit -a runneradmin -t user admin || true
          sudo dscl . -passwd /Users/runneradmin arham123 || true

          sudo pmset -a sleep 0
          sudo pmset -a displaysleep 0
          sudo pmset -a disksleep 0

          sudo mkdir -p /Library/Preferences
          echo "arham123" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_ = <>; chomp; s/^(.{8})./$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt
          
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users runneradmin -privs -all -restart -agent -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvnclegacy -vnclegacy yes
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

          sudo nohup bash -c 'sleep 5; killall loginwindow' >/dev/null 2>&1 &

      - name: Start TCP Tunnel with Pinggy
        run: |
          ssh -n -N -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:5900 tcp@free.pinggy.io > pinggy.log 2>&1 &
          SSH_PID=$!

          echo "Waiting for Pinggy tunnel URL..."
          for i in {1..30}; do
            if grep -q "tcp://" pinggy.log 2>/dev/null; then
              break
            fi
            sleep 1
          done

          echo "--- PINGGY TUNNEL URL ---"
          cat pinggy.log
          echo "-------------------------"

          # Keep the step alive by monitoring the SSH tunnel process
          while kill -0 $SSH_PID 2>/dev/null; do
            sleep 5
          done
