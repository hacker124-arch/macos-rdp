name: macos-vm
on: workflow_dispatch

jobs:
  vm:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
    steps:
      - name: Enable VNC
        run: |
          PW="${VNC_PASSWORD:0:8}"
          echo "VNC password length used: ${#PW}"

          # Wake the display and keep the Mac awake
          nohup caffeinate -dimsu > /dev/null 2>&1 &
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$PW" \
            -restart -agent -privs -all || true
          sudo sysadminctl -resetPasswordFor runner -newPassword "$PW" -adminUser runner -adminPassword - 2>&1 || true

          echo "---- console user ----"
          stat -f%Su /dev/console || true
          echo "---- displays ----"
          system_profiler SPDisplaysDataType | head -30 || true
          echo "---- screen capture test ----"
          screencapture -x /tmp/test.png && ls -l /tmp/test.png || echo "screencapture FAILED"

          sleep 5
          sudo lsof -iTCP:5900 -sTCP:LISTEN || echo "WARNING: VNC NOT LISTENING ON 5900"

      - name: Start bore tunnel
        run: |
          brew install bore-cli
          nohup bore local 5900 --to bore.pub > bore.log 2>&1 &
          sleep 8
          echo "---- bore log ----"
          cat bore.log
          echo "---- CONNECT TIGHTVNC TO THIS ----"
          grep -o 'bore.pub:[0-9]*' bore.log | head -1 || echo "No tunnel found, check log above"

      - name: Keep alive
        run: sleep 21000
