name: Build qvm_soft.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build qvm_soft.exe
        run: |
          # Find the folder that holds the engine source (the one with cpu_ext.cpp).
          SRC=$(dirname "$(find . -name cpu_ext.cpp -not -path './.git/*' | head -n 1)")
          echo "Engine source folder: $SRC"
          cd "$SRC"
          g++ -std=c++17 -O2 -Wall -Wextra -static -o qvm_soft.exe main.cpp cpu.cpp cpu_ext.cpp devices.cpp board.cpp fwcfg.cpp

      - uses: actions/upload-artifact@v4
        with:
          name: qvm_soft
          path: '**/qvm_soft.exe'
