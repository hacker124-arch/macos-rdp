name: Build whpx_firmware.exe (Windows)

# Builds the Windows firmware loader. The source is inside this workflow,
# so this single file is all you need in the repo.
# Run it from Actions -> Build whpx_firmware.exe -> Run workflow.
# Download the "whpx_firmware" artifact. Put whpx_firmware.exe next to
# OVMF_CODE.fd and OVMF_VARS.fd, then run it on a PC with
# "Windows Hypervisor Platform" turned on.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Compile whpx_firmware.exe
    runs-on: windows-2022
    steps:
      - name: Write the source file
        shell: pwsh
        run: |
          @'
          // whpx_firmware.cpp
          // Quantum VM engine: runs UEFI firmware (OVMF_CODE.fd + OVMF_VARS.fd) in a WHPX virtual
          // machine. The engine provides its own hardware: memory, serial port, a QEMU-style
          // firmware config, and a graphics card (PCI device 1234:1111, Bochs VBE mode setting)
          // whose memory is sent straight to the Quantum VM app.
          //
          // Output (stdout, binary): one frame after another. Each frame is:
          //   "QVMF" (4 bytes), width (u32 little endian), height (u32 little endian),
          //   then width * height * 4 bytes of pixels (BGRA, 32 bits per pixel).
          // Log messages go to stderr.
          //
          // Build (x64 Native Tools Command Prompt for VS 2022):
          //   cl /EHsc /std:c++17 whpx_firmware.cpp WinHvPlatform.lib
          // Run:
          //   whpx_firmware.exe OVMF_CODE.fd OVMF_VARS.fd
          //   whpx_firmware.exe --test-pattern      (moving test picture, no VM)

          #include <windows.h>
          #include <WinHvPlatform.h>
          #include <fcntl.h>
          #include <io.h>

          #include <atomic>
          #include <chrono>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <fstream>
          #include <iterator>
          #include <set>
          #include <string>
          #include <thread>
          #include <vector>

          #define LOG(...) std::fprintf(stderr, __VA_ARGS__)

          #define CHECK(hr, what)                                                    \
              do {                                                                   \
                  HRESULT _h = (hr);                                                 \
                  if (FAILED(_h)) {                                                  \
                      LOG("%s failed: 0x%08lX\n", what, (unsigned long)_h);          \
                      return 1;                                                      \
                  }                                                                  \
              } while (0)

          static const UINT64 RAM_SIZE = 256ULL * 1024 * 1024;   // guest RAM at address 0
          static const UINT64 FOUR_GB = 0x100000000ULL;          // firmware ends at the top of 4 GB
          static const UINT64 SCREEN_OFFSET = 0x0E000000ULL;     // screen before a graphics mode is set
          static const UINT64 FB_BASE = 0xE0000000ULL;           // graphics card memory, as the guest sees it
          static const UINT64 FB_SIZE = 16ULL * 1024 * 1024;     // 16 MB of graphics memory
          static const UINT64 PCI_BAR_MASK = 0xFF000000ULL;      // BAR size 16 MB: address bits 24 and up
          static const UINT16 VBE_ID = 0xB0C5;                   // Bochs VBE interface identifier
          static const int FRAME_MS = 66;                        // about 15 frames per second

          static std::atomic<bool> g_running{true};
          static std::atomic<bool> g_screen_on{false};           // true once the firmware sets a graphics mode
          static std::atomic<UINT32> g_screen_w{1024};
          static std::atomic<UINT32> g_screen_h{768};
          static uint8_t* g_fb = nullptr;                        // the graphics card memory

          static bool ReadWholeFile(const std::string& path, std::vector<uint8_t>& out) {
              std::ifstream f(path, std::ios::binary);
              if (!f) return false;
              out.assign(std::istreambuf_iterator<char>(f), std::istreambuf_iterator<char>());
              return !out.empty();
          }

          static HRESULT SetReg64(WHV_PARTITION_HANDLE part, WHV_REGISTER_NAME name, UINT64 value) {
              WHV_REGISTER_VALUE v = {};
              v.Reg64 = value;
              return WHvSetVirtualProcessorRegisters(part, 0, &name, 1, &v);
          }

          // Values the firmware reads from ports we do not emulate yet.
          static UINT32 ReadPort(UINT16 port) {
              switch (port) {
                  case 0x3FD: return 0x60;            // COM1 line status: transmitter empty and ready
                  case 0x3FA: return 0x01;            // COM1 interrupt status: nothing pending
                  case 0x0092: return 0x02;           // system control port: A20 gate enabled
                  default:    return 0xFFFFFFFF;      // "no device here" (reads back all ones)
              }
          }

          // CMOS (ports 0x70/0x71). The firmware reads the memory size from here. If these read back as
          // all ones, it thinks the machine has about 4 GB and puts its own data above 4 GB, where we have no memory.
          static UINT8 g_cmosIndex = 0;

          static UINT8 CmosValue(UINT8 index) {
              const UINT64 ramKb = RAM_SIZE / 1024;
              // Extended memory from 1 MB to 16 MB, in KB (capped at 15 MB).
              UINT64 ext1Kb = 0;
              if (ramKb > 1024) ext1Kb = (ramKb - 1024 < 15360) ? (ramKb - 1024) : 15360;
              // Memory above 16 MB, in 64 KB units.
              const UINT64 above16Mb = ramKb > 16384 ? (ramKb - 16384) / 64 : 0;
              switch (index) {
                  case 0x0A: return 0x26;                                  // status A: no update in progress
                  case 0x0B: return 0x02;                                  // status B: 24-hour mode
                  case 0x0D: return 0x80;                                  // status D: battery good
                  case 0x15: return 0x80;                                  // base memory 640 KB (low byte)
                  case 0x16: return 0x02;                                  // base memory 640 KB (high byte)
                  case 0x17: case 0x30: return static_cast<UINT8>(ext1Kb & 0xFF);
                  case 0x18: case 0x31: return static_cast<UINT8>((ext1Kb >> 8) & 0xFF);
                  case 0x34: return static_cast<UINT8>(above16Mb & 0xFF);
                  case 0x35: return static_cast<UINT8>((above16Mb >> 8) & 0xFF);
                  default:   return 0;
              }
          }

          static void PutU32(uint8_t* p, UINT32 v) {
              p[0] = v & 0xFF;
              p[1] = (v >> 8) & 0xFF;
              p[2] = (v >> 16) & 0xFF;
              p[3] = (v >> 24) & 0xFF;
          }

          // QEMU firmware config (ports 0x510 / 0x511). OVMF reads these items at startup.
          static std::vector<uint8_t> FwCfgItem(UINT16 key) {
              std::vector<uint8_t> v;
              switch (key) {
                  case 0x0000: v = {'Q', 'E', 'M', 'U'}; break;
                  case 0x0001: v.assign(4, 0); break;
                  case 0x0003:
                      v.assign(8, 0);
                      for (int i = 0; i < 8; ++i) v[i] = static_cast<uint8_t>(RAM_SIZE >> (8 * i));
                      break;
                  case 0x0019: v.assign(4, 0); break;
                  default: break;
              }
              return v;
          }

          // Everything the engine emulates besides memory and the CPU.
          struct Devices {
              WHV_PARTITION_HANDLE part = nullptr;
              UINT64 fbMapped = FB_BASE;        // where the graphics memory is mapped right now
              UINT32 pciAddress = 0;            // PCI configuration address (port 0xCF8)
              UINT32 pciCommand = 0;
              UINT32 barValue = 0;              // graphics card BAR0: address + flags
              bool barSizing = false;           // firmware is asking how big the BAR is
              UINT16 vbeIndex = 0;              // Bochs VBE register selected through port 0x1CE
              UINT16 vbe[10] = {};              // Bochs VBE registers 0..9
          };

          static void ApplyMode(const Devices& d) {
              const bool on = (d.vbe[4] & 0x1) != 0;
              const UINT32 w = d.vbe[1];
              const UINT32 h = d.vbe[2];
              if (on && w > 0 && h > 0 && w <= 2048 && h <= 1536 &&
                  static_cast<UINT64>(w) * h * 4 <= FB_SIZE) {
                  g_screen_w = w;
                  g_screen_h = h;
                  g_screen_on = true;
                  LOG("[screen] mode %ux%u\n", w, h);
              } else {
                  g_screen_on = false;
              }
          }

          static UINT16 VbeRead(const Devices& d) {
              if (d.vbeIndex == 0) return VBE_ID;
              if (d.vbeIndex < 10) return d.vbe[d.vbeIndex];
              return 0;
          }

          static void VbeWrite(Devices& d, UINT16 value) {
              if (d.vbeIndex == 0 || d.vbeIndex >= 10) return;   // version and unknown registers are ignored
              d.vbe[d.vbeIndex] = value;
              if (d.vbeIndex == 4) ApplyMode(d);                  // the ENABLE register
              if (d.vbeIndex == 1 || d.vbeIndex == 2) ApplyMode(d);
          }

          // The PCI bus has one device: the graphics card at bus 0, device 2, function 0.
          static bool PciSelected(const Devices& d) {
              const UINT32 a = d.pciAddress;
              return (a & 0x80000000u) && ((a >> 16) & 0xFF) == 0 &&
                     ((a >> 11) & 0x1F) == 2 && ((a >> 8) & 0x7) == 0;
          }

          static UINT32 PciRead(const Devices& d) {
              if (!PciSelected(d)) return 0xFFFFFFFF;
              switch (d.pciAddress & 0xFC) {
                  case 0x00: return 0x11111234u;                            // vendor 0x1234, device 0x1111
                  case 0x04: return d.pciCommand;
                  case 0x08: return 0x03000002u;                            // display controller, revision 2
                  case 0x0C: return 0x00000000u;                            // header type 0
                  case 0x10: return d.barSizing ? (static_cast<UINT32>(PCI_BAR_MASK) | 0x8) : d.barValue;
                  default:   return 0;
              }
          }

          static void PciWrite(Devices& d, UINT32 value) {
              if (!PciSelected(d)) return;
              switch (d.pciAddress & 0xFC) {
                  case 0x04:
                      d.pciCommand = value & 0xFFFF;
                      break;
                  case 0x10: {
                      if (value == 0xFFFFFFFFu) {                           // size probe: answer on the next read
                          d.barSizing = true;
                          break;
                      }
                      d.barSizing = false;
                      const UINT64 base = value & PCI_BAR_MASK;
                      if (base < RAM_SIZE || base + FB_SIZE > FOUR_GB) {
                          LOG("[pci] graphics memory base 0x%08X is not allowed\n", value);
                          break;
                      }
                      if (base != d.fbMapped) {
                          WHvUnmapGpaRange(d.part, d.fbMapped, FB_SIZE);
                          HRESULT hr = WHvMapGpaRange(d.part, g_fb, base, FB_SIZE,
                                                      WHvMapGpaRangeFlagRead | WHvMapGpaRangeFlagWrite);
                          if (FAILED(hr)) {
                              LOG("[pci] could not map graphics memory at 0x%llX (0x%08lX)\n",
                                  (unsigned long long)base, (unsigned long)hr);
                              break;
                          }
                          d.fbMapped = base;
                          LOG("[pci] graphics memory at 0x%llX\n", (unsigned long long)base);
                      }
                      d.barValue = static_cast<UINT32>(base) | 0x8;
                      break;
                  }
                  default:
                      break;
              }
          }

          // Sends one frame to the app.
          static void SendFrame(UINT32 w, UINT32 h, const uint8_t* pixels) {
              const size_t bytes = static_cast<size_t>(w) * h * 4;
              std::vector<uint8_t> frame(12 + bytes);
              std::memcpy(frame.data(), "QVMF", 4);
              PutU32(frame.data() + 4, w);
              PutU32(frame.data() + 8, h);
              std::memcpy(frame.data() + 12, pixels, bytes);
              std::fwrite(frame.data(), 1, frame.size(), stdout);
              std::fflush(stdout);
          }

          // Sends the screen until the VM stops: the graphics card memory once the firmware has set
          // a mode, otherwise the old screen area in RAM.
          static void ScreenLoop(const uint8_t* ram) {
              while (g_running) {
                  if (g_screen_on) {
                      SendFrame(g_screen_w, g_screen_h, g_fb);
                  } else {
                      SendFrame(1024, 768, ram + SCREEN_OFFSET);
                  }
                  std::this_thread::sleep_for(std::chrono::milliseconds(FRAME_MS));
              }
          }

          // Test picture: a moving gradient, so the display can be checked without a VM.
          static int TestPattern() {
              const UINT32 w = 1024, h = 768;
              std::vector<uint8_t> pixels(static_cast<size_t>(w) * h * 4);
              for (uint32_t t = 0;; ++t) {
                  for (uint32_t y = 0; y < h; ++y) {
                      for (uint32_t x = 0; x < w; ++x) {
                          uint8_t* p = &pixels[(static_cast<size_t>(y) * w + x) * 4];
                          p[0] = static_cast<uint8_t>(x);            // blue
                          p[1] = static_cast<uint8_t>(y);            // green
                          p[2] = static_cast<uint8_t>(x + t * 2);    // red
                          p[3] = 0;
                      }
                  }
                  SendFrame(w, h, pixels.data());
                  std::this_thread::sleep_for(std::chrono::milliseconds(FRAME_MS));
              }
              return 0;
          }

          // Reads 8 bytes of guest RAM at a physical address.
          static UINT64 ReadGuest64(const uint8_t* ram, UINT64 phys, bool& ok) {
              if (phys + 8 > RAM_SIZE) {
                  ok = false;
                  return 0;
              }
              UINT64 v = 0;
              std::memcpy(&v, ram + phys, 8);
              ok = true;
              return v;
          }

          // Walks the guest page tables for one virtual address and prints each entry.
          static void DumpPaging(const uint8_t* ram, UINT64 cr3, UINT64 va) {
              static const int shifts[4] = {39, 30, 21, 12};
              static const char* names[4] = {"PML4", "PDPT", "PD", "PT"};
              UINT64 table = cr3 & 0x000FFFFFFFFFF000ULL;
              for (int level = 0; level < 4; ++level) {
                  const UINT64 index = (va >> shifts[level]) & 0x1FF;
                  bool ok = false;
                  const UINT64 entry = ReadGuest64(ram, table + index * 8, ok);
                  if (!ok) {
                      LOG("[paging] %s table at 0x%llX is outside guest RAM\n", names[level], (unsigned long long)table);
                      return;
                  }
                  LOG("[paging] %s[%llu] = 0x%llX%s\n", names[level], (unsigned long long)index,
                      (unsigned long long)entry, (entry & 1) ? "" : " (not present)");
                  if (!(entry & 1))
                      return;
                  if ((level == 1 || level == 2) && (entry & 0x80)) {
                      LOG("[paging] large page\n");
                      return;
                  }
                  table = entry & 0x000FFFFFFFFFF000ULL;
              }
          }

          // Prints the main registers, so we can see what the code at RIP was doing.
          static void DumpRegisters(WHV_PARTITION_HANDLE part, const uint8_t* ram) {
              const WHV_REGISTER_NAME names[] = {
                  WHvX64RegisterRax, WHvX64RegisterRcx, WHvX64RegisterRsi, WHvX64RegisterRdi,
                  WHvX64RegisterRsp, WHvX64RegisterCr0, WHvX64RegisterCr3, WHvX64RegisterCr4,
                  WHvX64RegisterEfer, WHvX64RegisterCs, WHvX64RegisterCr2,
              };
              WHV_REGISTER_VALUE v[11] = {};
              if (FAILED(WHvGetVirtualProcessorRegisters(part, 0, names, 11, v))) {
                  LOG("[could not read registers]\n");
                  return;
              }
              // The first eight stack slots (from RSP up). A RET jumps to the value at the top of the stack.
              const UINT64 sp = v[4].Reg64;
              if (sp + 64 <= RAM_SIZE) {
                  LOG("[stack from RSP:");
                  for (int i = 0; i < 8; ++i) {
                      UINT64 slot = 0;
                      std::memcpy(&slot, ram + sp + i * 8, 8);
                      LOG(" %016llX", (unsigned long long)slot);
                  }
                  LOG("]\n");
              }
              LOG("[rax %llX rcx %llX rsi %llX rdi %llX rsp %llX]\n",
                  (unsigned long long)v[0].Reg64, (unsigned long long)v[1].Reg64,
                  (unsigned long long)v[2].Reg64, (unsigned long long)v[3].Reg64,
                  (unsigned long long)v[4].Reg64);
              LOG("[cr0 %llX cr3 %llX cr4 %llX efer %llX cs base %llX]\n",
                  (unsigned long long)v[5].Reg64, (unsigned long long)v[6].Reg64,
                  (unsigned long long)v[7].Reg64, (unsigned long long)v[8].Reg64,
                  (unsigned long long)v[9].Segment.Base);
              LOG("[cr2 (last page fault address) %llX]\n", (unsigned long long)v[10].Reg64);

              // The interrupt table and the descriptor table: a fault is only handled if these are set.
              const WHV_REGISTER_NAME tnames[] = {WHvX64RegisterIdtr, WHvX64RegisterGdtr};
              WHV_REGISTER_VALUE t[2] = {};
              if (SUCCEEDED(WHvGetVirtualProcessorRegisters(part, 0, tnames, 2, t))) {
                  LOG("[idtr base %llX limit %X] [gdtr base %llX limit %X]\n",
                      (unsigned long long)t[0].Table.Base, (unsigned)t[0].Table.Limit,
                      (unsigned long long)t[1].Table.Base, (unsigned)t[1].Table.Limit);
              }

              DumpPaging(ram, v[6].Reg64, v[10].Reg64);
          }

          // Every port access is logged (port, size, value, RIP), up to this many lines.
          static int g_ioLogged = 0;
          static const int kIoLogLimit = 2000;

          // Prints the 16 bytes of guest memory at an address, so we can see the code that stopped.
          static void DumpBytes(const uint8_t* ram, UINT64 address) {
              if (address + 16 > RAM_SIZE) {
                  LOG("[RIP is outside guest RAM]\n");
                  return;
              }
              LOG("[bytes at RIP:");
              for (int i = 0; i < 16; ++i) LOG(" %02X", ram[address + i]);
              LOG("]\n");
          }

          // Runs the virtual CPU until the guest stops. Returns 0 on a normal stop, 1 on error.
          static int RunLoop(WHV_PARTITION_HANDLE part, const uint8_t* ram, Devices& dev) {
              std::set<UINT16> unknownPorts;
              std::set<UINT32> unknownMsrs;
              std::set<UINT64> seenRips;
              UINT16 fwSelector = 0;
              UINT32 fwOffset = 0;
              std::vector<uint8_t> fwItem = FwCfgItem(0);
              LOG("Starting firmware...\n");

              // Heartbeat: every 2 seconds the CPU is paused, so we can log where the firmware is, then it resumes.
              std::atomic<bool> heartbeatOn(true);
              std::thread heartbeat([&]() {
                  while (heartbeatOn.load()) {
                      std::this_thread::sleep_for(std::chrono::seconds(2));
                      if (heartbeatOn.load()) WHvCancelRunVirtualProcessor(part, 0, 0);
                  }
              });
              struct HeartbeatStopper {
                  std::atomic<bool>& flag;
                  std::thread& thread;
                  ~HeartbeatStopper() {
                      flag = false;
                      if (thread.joinable()) thread.join();
                  }
              } stopper{heartbeatOn, heartbeat};

              for (;;) {
                  WHV_RUN_VP_EXIT_CONTEXT exit = {};
                  CHECK(WHvRunVirtualProcessor(part, 0, &exit, sizeof(exit)), "WHvRunVirtualProcessor");

                  if (exit.ExitReason == WHvRunVpExitReasonX64IoPortAccess) {
                      const auto& io = exit.IoPortAccess;
                      const UINT16 port = io.PortNumber;
                      const UINT32 size = io.AccessInfo.AccessSize;   // 1, 2 or 4 bytes
                      const UINT64 mask = size == 1 ? 0xFFULL : size == 2 ? 0xFFFFULL : 0xFFFFFFFFULL;

                      if (g_ioLogged < kIoLogLimit) {
                          ++g_ioLogged;
                          if (io.AccessInfo.IsWrite)
                              LOG("[io] out port 0x%04X size %u value 0x%llX RIP 0x%llX\n", port, size,
                                  (unsigned long long)(io.Rax & mask), (unsigned long long)exit.VpContext.Rip);
                          else
                              LOG("[io] in  port 0x%04X size %u RIP 0x%llX\n", port, size,
                                  (unsigned long long)exit.VpContext.Rip);
                      }

                      if (io.AccessInfo.IsWrite) {
                          const UINT32 value = static_cast<UINT32>(io.Rax & mask);
                          if (port == 0x3F8) {
                              std::fputc(static_cast<int>(value & 0xFF), stderr);   // serial output goes to the log
                          } else if (port == 0x0510) {
                              fwSelector = static_cast<UINT16>(value & 0xFFFF);
                              fwOffset = 0;
                              fwItem = FwCfgItem(fwSelector);
                          } else if (port == 0xCF8) {
                              dev.pciAddress = value;
                          } else if (port >= 0xCFC && port <= 0xCFF) {
                              PciWrite(dev, value);
                          } else if (port == 0x1CE) {
                              dev.vbeIndex = static_cast<UINT16>(value & 0xFFFF);
                          } else if (port == 0x1CF) {
                              VbeWrite(dev, static_cast<UINT16>(value & 0xFFFF));
                          } else if (port == 0x70) {
                              g_cmosIndex = static_cast<UINT8>(value & 0x7F);
                          } else if (port == 0x71 || port == 0x20 || port == 0x21 || port == 0xA0 || port == 0xA1) {
                              // ignored: CMOS data writes and the interrupt controller (not emulated yet)
                          } else if (port == 0x80 || port == 0x0092) {
                              // ignored: debug port and system control port
                          } else if (unknownPorts.insert(port).second) {
                              LOG("\n[note] write to unhandled port 0x%04X\n", port);
                          }
                      } else {
                          UINT64 value;
                          if (port == 0x0511) {
                              value = fwOffset < fwItem.size() ? fwItem[fwOffset] : 0;
                              ++fwOffset;
                          } else if (port == 0xCF8) {
                              value = dev.pciAddress;
                          } else if (port >= 0xCFC && port <= 0xCFF) {
                              value = PciRead(dev) >> ((port & 3) * 8);
                          } else if (port == 0x1CE) {
                              value = dev.vbeIndex;
                          } else if (port == 0x1CF) {
                              value = VbeRead(dev);
                          } else if (port == 0x70) {
                              value = g_cmosIndex;
                          } else if (port == 0x71) {
                              value = CmosValue(g_cmosIndex);
                          } else {
                              value = ReadPort(port);
                          }
                          if (port != 0x3FD && port != 0x3FA && port != 0x0511 && port != 0x0092 &&
                              port != 0x70 && port != 0x71 &&
                              port != 0xCF8 && !(port >= 0xCFC && port <= 0xCFF) &&
                              port != 0x1CE && port != 0x1CF && unknownPorts.insert(port).second)
                              LOG("\n[note] read from unhandled port 0x%04X\n", port);
                          if (g_ioLogged <= kIoLogLimit)
                              LOG("[io]      -> 0x%llX\n", (unsigned long long)(value & mask));
                          UINT64 newRax = (io.Rax & ~mask) | (value & mask);
                          CHECK(SetReg64(part, WHvX64RegisterRax, newRax), "set RAX");
                      }

                      // Move past the IN/OUT instruction so it is not run again.
                      CHECK(SetReg64(part, WHvX64RegisterRip,
                                     exit.VpContext.Rip + exit.VpContext.InstructionLength),
                            "advance RIP");

                  } else if (exit.ExitReason == WHvRunVpExitReasonCanceled) {
                      // Heartbeat pause: show where the firmware is, then keep running.
                      LOG("[heartbeat] RIP 0x%llX\n", (unsigned long long)exit.VpContext.Rip);
                      // The first time we see a new address, print the instructions and registers there.
                      if (seenRips.insert(exit.VpContext.Rip).second) {
                          // Show the 64 bytes before this address too, so the code that leads here is visible.
                          const UINT64 rip = exit.VpContext.Rip;
                          DumpBytes(ram, rip - 48);
                          DumpBytes(ram, rip - 32);
                          DumpBytes(ram, rip - 16);
                          DumpBytes(ram, rip);
                          DumpRegisters(part, ram);
                      }

                  } else if (exit.ExitReason == WHvRunVpExitReasonX64MsrAccess) {
                      // The firmware reads or writes an MSR we do not emulate (for example IA32_PLATFORM_ID, 0x17).
                      // Reads return 0 and writes are ignored, instead of letting the CPU raise #GP.
                      const auto& msr = exit.MsrAccess;
                      if (!msr.AccessInfo.IsWrite) {
                          if (unknownMsrs.insert(msr.MsrNumber).second)
                              LOG("\n[note] read from unemulated MSR 0x%X\n", (unsigned)msr.MsrNumber);
                          CHECK(SetReg64(part, WHvX64RegisterRax, 0), "set RAX");
                          CHECK(SetReg64(part, WHvX64RegisterRdx, 0), "set RDX");
                      }
                      CHECK(SetReg64(part, WHvX64RegisterRip,
                                     exit.VpContext.Rip + exit.VpContext.InstructionLength),
                            "advance RIP");

                  } else if (exit.ExitReason == WHvRunVpExitReasonMemoryAccess) {
                      LOG("\n[stop] firmware accessed unmapped address 0x%llX at RIP 0x%llX\n",
                          (unsigned long long)exit.MemoryAccess.Gpa,
                          (unsigned long long)exit.VpContext.Rip);
                      return 0;

                  } else if (exit.ExitReason == WHvRunVpExitReasonX64Halt) {
                      LOG("\n[guest halted at RIP 0x%llX]\n", (unsigned long long)exit.VpContext.Rip);
                      return 0;

                  } else if (exit.ExitReason == WHvRunVpExitReasonException) {
                      LOG("\n[stop] guest exception %u, error code 0x%X, parameter 0x%llX, RIP 0x%llX\n",
                          (unsigned)exit.VpException.ExceptionType, (unsigned)exit.VpException.ErrorCode,
                          (unsigned long long)exit.VpException.ExceptionParameter,
                          (unsigned long long)exit.VpContext.Rip);
                      DumpRegisters(part, ram);
                      DumpBytes(ram, exit.VpContext.Rip);
                      return 0;

                  } else if (exit.ExitReason == WHvRunVpExitReasonUnrecoverableException) {
                      LOG("\n[stop] unrecoverable exception (guest faulted and could not recover) at RIP 0x%llX\n",
                          (unsigned long long)exit.VpContext.Rip);
                      DumpRegisters(part, ram);
                      DumpBytes(ram, exit.VpContext.Rip);
                      return 0;

                  } else {
                      LOG("\n[stop] unexpected VM exit, reason %d, RIP 0x%llX\n",
                          (int)exit.ExitReason, (unsigned long long)exit.VpContext.Rip);
                      DumpRegisters(part, ram);
                      DumpBytes(ram, exit.VpContext.Rip);
                      return 0;
                  }
              }
          }

          int main(int argc, char** argv) {
              // Frames are binary data on stdout. Log text goes to stderr, so the two never mix.
              _setmode(_fileno(stdout), _O_BINARY);

              if (argc > 1 && std::strcmp(argv[1], "--test-pattern") == 0)
                  return TestPattern();

              std::string codePath = argc > 1 ? argv[1] : "OVMF_CODE.fd";
              std::string varsPath = argc > 2 ? argv[2] : "OVMF_VARS.fd";

              // 1. Load the firmware files.
              std::vector<uint8_t> code, vars;
              if (!ReadWholeFile(codePath, code)) { LOG("Cannot read %s\n", codePath.c_str()); return 1; }
              if (!ReadWholeFile(varsPath, vars)) { LOG("Cannot read %s\n", varsPath.c_str()); return 1; }
              LOG("Firmware code: %s (%zu bytes)\n", codePath.c_str(), code.size());
              LOG("Firmware vars: %s (%zu bytes)\n", varsPath.c_str(), vars.size());

              // WHPX maps memory in whole 4 KB pages. Pad the front of the code image with zeros so its
              // size is a multiple of 4 KB. It still ends at the top of the first 4 GB, so the reset vector
              // stays where the firmware expects it.
              const size_t kPage = 4096;
              const size_t codePad = (kPage - (code.size() % kPage)) % kPage;
              if (codePad) {
                  code.insert(code.begin(), codePad, 0);
                  LOG("Padded firmware code by %zu bytes to %zu bytes (4 KB pages)\n", codePad, code.size());
              }
              if (vars.size() % kPage) {
                  LOG("Firmware vars size %zu is not a multiple of 4 KB\n", vars.size());
                  return 1;
              }

              // The code image sits at the top of the first 4 GB, so its last byte is at 0xFFFFFFFF.
              // The variable store goes just below it.
              const UINT64 codeBase = FOUR_GB - code.size();
              const UINT64 varsBase = codeBase - vars.size();
              LOG("Code at 0x%llX, vars at 0x%llX\n",
                  (unsigned long long)codeBase, (unsigned long long)varsBase);

              // 2. Create the VM with one virtual CPU.
              WHV_PARTITION_HANDLE part = nullptr;
              CHECK(WHvCreatePartition(&part), "WHvCreatePartition");

              UINT32 cpus = 1;
              CHECK(WHvSetPartitionProperty(part, WHvPartitionPropertyCodeProcessorCount,
                                            &cpus, sizeof(cpus)),
                    "set CPU count");

              // Let Windows emulate the local APIC. If this fails, the program keeps going.
              WHV_X64_LOCAL_APIC_EMULATION_MODE apic = WHvX64LocalApicEmulationModeXApic;
              HRESULT apicHr = WHvSetPartitionProperty(part, WHvPartitionPropertyCodeLocalApicEmulationMode,
                                                       &apic, sizeof(apic));
              if (FAILED(apicHr))
                  LOG("Note: APIC emulation not enabled (0x%08lX)\n", (unsigned long)apicHr);

              // Ask Windows to stop the VM on page faults (exception vector 14), so we see the address.
              UINT64 exceptionBitmap = 1ULL << 14;
              HRESULT excHr = WHvSetPartitionProperty(part, WHvPartitionPropertyCodeExceptionExitBitmap,
                                                      &exceptionBitmap, sizeof(exceptionBitmap));
              if (FAILED(excHr))
                  LOG("Note: page fault reporting not enabled (0x%08lX)\n", (unsigned long)excHr);

              // Ask Windows to stop on RDMSR/WRMSR, so we can answer for MSRs we do not emulate.
              WHV_EXTENDED_VM_EXITS extendedExits = {};
              extendedExits.X64MsrExit = 1;
              HRESULT msrHr = WHvSetPartitionProperty(part, WHvPartitionPropertyCodeExtendedVmExits,
                                                      &extendedExits, sizeof(extendedExits));
              if (FAILED(msrHr))
                  LOG("Note: MSR exits not enabled (0x%08lX)\n", (unsigned long)msrHr);

              CHECK(WHvSetupPartition(part), "WHvSetupPartition");

              // 3. Map memory: RAM, the firmware code (read + execute), the variable store and
              //    the graphics card memory.
              void* ram = VirtualAlloc(nullptr, RAM_SIZE, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
              void* codeMem = VirtualAlloc(nullptr, code.size(), MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
              void* varsMem = VirtualAlloc(nullptr, vars.size(), MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
              g_fb = static_cast<uint8_t*>(VirtualAlloc(nullptr, FB_SIZE, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE));
              if (!ram || !codeMem || !varsMem || !g_fb) { LOG("VirtualAlloc failed\n"); return 1; }
              std::memcpy(codeMem, code.data(), code.size());
              std::memcpy(varsMem, vars.data(), vars.size());

              const auto rwx = static_cast<WHV_MAP_GPA_RANGE_FLAGS>(WHvMapGpaRangeFlagRead | WHvMapGpaRangeFlagWrite | WHvMapGpaRangeFlagExecute);
              const auto rw = static_cast<WHV_MAP_GPA_RANGE_FLAGS>(WHvMapGpaRangeFlagRead | WHvMapGpaRangeFlagWrite);
              CHECK(WHvMapGpaRange(part, ram, 0, RAM_SIZE, rwx), "map RAM");
              CHECK(WHvMapGpaRange(part, codeMem, codeBase, code.size(), rwx), "map firmware code");
              CHECK(WHvMapGpaRange(part, varsMem, varsBase, vars.size(), rw), "map firmware vars");
              CHECK(WHvMapGpaRange(part, g_fb, FB_BASE, FB_SIZE, rw), "map graphics memory");

              Devices dev;
              dev.part = part;
              dev.fbMapped = FB_BASE;
              dev.barValue = static_cast<UINT32>(FB_BASE) | 0x8;
              dev.vbe[1] = 1024;
              dev.vbe[2] = 768;
              dev.vbe[3] = 32;

              // 4. Create the CPU and start it at the x86 reset vector (0xFFFFFFF0),
              //    in the same state a real PC uses after power-on.
              CHECK(WHvCreateVirtualProcessor(part, 0, 0), "WHvCreateVirtualProcessor");

              auto segment = [](UINT64 base, UINT16 selector, UINT16 attributes) {
                  WHV_X64_SEGMENT_REGISTER s = {};
                  s.Base = base;
                  s.Limit = 0xFFFF;
                  s.Selector = selector;
                  s.Attributes = attributes;
                  return s;
              };

              WHV_REGISTER_NAME names[] = {
                  WHvX64RegisterCs, WHvX64RegisterDs, WHvX64RegisterEs, WHvX64RegisterSs,
                  WHvX64RegisterCr0, WHvX64RegisterRflags, WHvX64RegisterRip,
              };
              WHV_REGISTER_VALUE values[7] = {};
              values[0].Segment = segment(0xFFFF0000ULL, 0xF000, 0x9B);  // CS = reset segment
              values[1].Segment = segment(0, 0, 0x93);                   // DS
              values[2].Segment = segment(0, 0, 0x93);                   // ES
              values[3].Segment = segment(0, 0, 0x93);                   // SS
              values[4].Reg64 = 0x60000010;   // CR0: real mode, caches disabled (power-on state)
              values[5].Reg64 = 0x2;          // RFLAGS
              values[6].Reg64 = 0xFFF0;       // RIP: reset vector (CS base + RIP = 0xFFFFFFF0)
              CHECK(WHvSetVirtualProcessorRegisters(part, 0, names, 7, values), "set reset registers");

              // 5. Send the screen to the app while the firmware runs.
              std::thread screen(ScreenLoop, static_cast<const uint8_t*>(ram));
              int result = RunLoop(part, static_cast<const uint8_t*>(ram), dev);
              g_running = false;
              screen.join();

              // 6. Clean up.
              WHvDeletePartition(part);
              VirtualFree(ram, 0, MEM_RELEASE);
              VirtualFree(codeMem, 0, MEM_RELEASE);
              VirtualFree(varsMem, 0, MEM_RELEASE);
              VirtualFree(g_fb, 0, MEM_RELEASE);
              return result;
          }
          '@ | Set-Content -Encoding ascii whpx_firmware.cpp

      - name: Set up the Visual C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        shell: cmd
        run: cl /EHsc /std:c++17 whpx_firmware.cpp WinHvPlatform.lib /Fe:whpx_firmware.exe

      - name: Show the file
        shell: pwsh
        run: Get-Item whpx_firmware.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: whpx_firmware
          path: whpx_firmware.exe
          if-no-files-found: error
