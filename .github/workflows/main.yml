name: vnc-vm

# ============================================================
# PASTE YOUR DIRECT ISO DOWNLOAD LINK HERE (between the quotes)
# You can also leave it and paste a link when you click "Run workflow"
# ============================================================
env:
  ISO_URL: "https://iso.pearos.xyz/iso/pearOS-NiceC0re-2026.11-x86_64.iso?exp=1794490996&sig=01d6b5e0a06b2f7d082ab348f909b646f716e7b1d78e8efd0a46ae7c433a97dc&tier=free"

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Optional: ISO link (overrides the one in the file)"
        required: false
      runner:
        description: "Runner label. Use the name of your large runner (e.g. 16-core) to actually get 12 cores / 32GB"
        default: "ubuntu-latest"
      ram_mb:
        description: "VM RAM in MB"
        default: "32768"
      cpus:
        description: "VM CPU count"
        default: "12"
      disk_gb:
        description: "VM disk size in GB (virtual, grows as used)"
        default: "1024"
      minutes:
        description: "How long to keep the session alive (max ~350)"
        default: "120"

jobs:
  vm:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 355
    steps:
      - name: Download ISO (first step)
        env:
          URL: ${{ inputs.iso_url || env.ISO_URL }}
        run: |
          if [ -z "$URL" ] || [ "$URL" = "PASTE_DIRECT_ISO_LINK_HERE" ]; then
            echo "No ISO link set. Edit ISO_URL at the top of the file or paste one when running the workflow."
            exit 1
          fi
          echo "Downloading ISO with 16 parallel connections..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2
          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --max-concurrent-downloads=1 \
            --file-allocation=none \
            --summary-interval=5 \
            --console-log-level=warn \
            --retry-wait=3 --max-tries=5 \
            --allow-overwrite=true \
            -o my.iso "$URL" \
          || { echo "aria2 failed, falling back to curl"; curl -fL --retry 3 -o my.iso "$URL"; }
          ls -lh my.iso

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Fit VM to what the runner really has
        run: |
          REQ_CPUS=${{ inputs.cpus }}
          REQ_RAM=${{ inputs.ram_mb }}
          REQ_DISK=${{ inputs.disk_gb }}

          AVAIL_CPUS=$(nproc)
          AVAIL_RAM=$(( $(free -m | awk '/Mem:/{print $2}') - 1536 ))
          AVAIL_DISK=$(( $(df --output=avail -BG / | tail -1 | tr -dc '0-9') - 3 ))

          CPUS=$(( REQ_CPUS < AVAIL_CPUS ? REQ_CPUS : AVAIL_CPUS ))
          RAM=$(( REQ_RAM < AVAIL_RAM ? REQ_RAM : AVAIL_RAM ))
          DISK=$(( REQ_DISK < AVAIL_DISK ? REQ_DISK : AVAIL_DISK ))

          echo "Requested: ${REQ_CPUS} cores, ${REQ_RAM} MB RAM, ${REQ_DISK} GB disk"
          echo "Runner can give: ${AVAIL_CPUS} cores, ${AVAIL_RAM} MB RAM, ${AVAIL_DISK} GB disk"
          echo "Using:     ${CPUS} cores, ${RAM} MB RAM, ${DISK} GB disk"
          if [ "$CPUS" -lt "$REQ_CPUS" ] || [ "$RAM" -lt "$REQ_RAM" ] || [ "$DISK" -lt "$REQ_DISK" ]; then
            echo "::warning::Runner is smaller than requested, so the VM was scaled down. Use a larger runner for more."
          fi

          echo "VM_CPUS=$CPUS" >> "$GITHUB_ENV"
          echo "VM_RAM=$RAM" >> "$GITHUB_ENV"
          echo "VM_DISK=$DISK" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils novnc websockify

      - name: Start VM with the ISO (VNC on :5900)
        run: |
          qemu-img create -f qcow2 disk.qcow2 ${VM_DISK}G
          qemu-system-x86_64 \
            -enable-kvm -cpu host \
            -m ${VM_RAM} -smp ${VM_CPUS} \
            -drive file=disk.qcow2,format=qcow2,if=virtio \
            -cdrom my.iso -boot d \
            -vga std -device qemu-xhci -device usb-tablet \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -vnc 127.0.0.1:0 \
            -daemonize
          sleep 3
          ss -ltnp | grep 5900

          # noVNC: browser-based viewer on port 6080 (proxies to QEMU's VNC)
          sudo ln -sf /usr/share/novnc/vnc.html /usr/share/novnc/index.html
          nohup websockify --web /usr/share/novnc 6080 127.0.0.1:5900 > websockify.log 2>&1 &
          sleep 2
          ss -ltnp | grep 6080

      - name: Join Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname=gh-vnc-vm --accept-dns=false
          echo "=================================================="
          echo "Open this in your browser (Tailscale must be running on your PC):"
          echo "http://$(tailscale ip -4):6080/vnc.html?autoconnect=true&resize=scale"
          echo "(or http://gh-vnc-vm:6080/vnc.html?autoconnect=true with MagicDNS)"
          echo "=================================================="

      - name: Keep alive
        run: |
          echo "Sleeping for ${{ inputs.minutes }} minutes..."
          sleep $(( ${{ inputs.minutes }} * 60 ))
