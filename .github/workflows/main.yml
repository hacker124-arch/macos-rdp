name: macos-vm
on: workflow_dispatch

jobs:
  vm:
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
    steps:
      - name: Grant permissions and enable VNC
        run: |
          PW="${VNC_PASSWORD:0:8}"
          echo "VNC password length used: ${#PW}"

          nohup caffeinate -dimsu > /dev/null 2>&1 &
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true

          sudo dscl . -passwd /Users/runner "$PW" 2>&1 || echo "dscl passwd FAILED"
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser runner || true

          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          CLIENTS=(
            "com.apple.screensharing.agent:0"
            "com.apple.RemoteDesktopAgent:0"
            "com.apple.ARDAgent:0"
            "com.apple.screensharingd:0"
            "/usr/libexec/screensharingd:1"
            "/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/MacOS/ARDAgent:1"
            "/System/Library/CoreServices/RemoteManagement/ARDAgent.app:1"
          )
          for ENTRY in "${CLIENTS[@]}"; do
            CLIENT="${ENTRY%:*}"; TYPE="${ENTRY##*:}"
            for SERVICE in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServicePostEvent kTCCServiceListenEvent; do
              sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('$SERVICE','$CLIENT',$TYPE,2,4,1);" 2>&1 \
                && echo "TCC OK: $SERVICE $CLIENT" || echo "TCC FAILED: $SERVICE $CLIENT"
            done
          done

          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo $KS -activate -configure -allowAccessFor -allUsers -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$PW" \
            -privs -all -restart -agent || true
          sleep 5

          # Watchdog: if VNC stops listening (e.g. after login), restart it
          cat > /tmp/watchdog.sh <<EOF
          #!/bin/bash
          while true; do
            if ! lsof -iTCP:5900 -sTCP:LISTEN >/dev/null 2>&1; then
              $KS -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes -clientopts -setvncpw -vncpw "$PW" -privs -all -restart -agent
            fi
            sleep 20
          done
          EOF
          chmod +x /tmp/watchdog.sh
          sudo nohup /tmp/watchdog.sh > /tmp/watchdog.log 2>&1 &
