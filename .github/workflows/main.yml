name: vnc-vm

# ============================================================
# PASTE YOUR DIRECT ISO DOWNLOAD LINK HERE (between the quotes)
# You can also leave it and paste a link when you click "Run workflow"
# ============================================================
env:
  ISO_URL: "https://iso.pearos.xyz/iso/pearOS-NiceC0re-2026.11-x86_64.iso"

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Optional: ISO link (overrides the one in the file)"
        required: false
      runner:
        description: "Runner label. Use the name of your large runner (e.g. 16-core) to actually get 12 cores / 32GB"
        default: "ubuntu-latest"
      ram_mb:
        description: "VM RAM in MB"
        default: "32768"
      cpus:
        description: "VM CPU count"
        default: "12"
      disk_gb:
        description: "VM disk size in GB (virtual, grows as used)"
        default: "1024"
      minutes:
        description: "How long to keep the session alive (max ~350)"
        default: "120"

jobs:
  vm:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 355
    steps:
      - name: Download ISO (first step)
        env:
          URL: ${{ inputs.iso_url || env.ISO_URL }}
        run: |
          if [ -z "$URL" ] || [ "$URL" = "PASTE_DIRECT_ISO_LINK_HERE" ]; then
            echo "No ISO link set. Edit ISO_URL at the top of the file or paste one when running the workflow."
            exit 1
          fi
          echo "Downloading ISO..."
          curl -fL --retry 3 -o my.iso "$URL"
          ls -lh my.iso

      - name: Check runner resources
        run: |
          echo "Runner has: $(nproc) cores, $(free -g | awk '/Mem:/{print $2}') GB RAM"
          df -h / /mnt 2>/dev/null
          if [ "$(nproc)" -lt "${{ inputs.cpus }}" ]; then
            echo "::warning::Runner has fewer cores than the ${{ inputs.cpus }} requested. The VM will still start but be oversubscribed and slow."
          fi
          if [ "$(free -m | awk '/Mem:/{print $2}')" -lt "${{ inputs.ram_mb }}" ]; then
            echo "::warning::Runner has less RAM than the ${{ inputs.ram_mb }} MB requested. The VM may be killed (out of memory). Use a larger runner."
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: Start VM with the ISO (VNC on :5900)
        run: |
          qemu-img create -f qcow2 disk.qcow2 ${{ inputs.disk_gb }}G
          qemu-system-x86_64 \
            -enable-kvm -cpu host \
            -m ${{ inputs.ram_mb }} -smp ${{ inputs.cpus }} \
            -drive file=disk.qcow2,format=qcow2,if=virtio \
            -cdrom my.iso -boot d \
            -vga std -device qemu-xhci -device usb-tablet \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -vnc 0.0.0.0:0 \
            -daemonize
          sleep 3
          ss -ltnp | grep 5900

      - name: Join Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname=gh-vnc-vm --accept-dns=false
          echo "=================================================="
          echo "Connect your VNC client to: $(tailscale ip -4):5900"
          echo "(or gh-vnc-vm:5900 with MagicDNS)"
          echo "=================================================="

      - name: Keep alive
        run: |
          echo "Sleeping for ${{ inputs.minutes }} minutes..."
          sleep $(( ${{ inputs.minutes }} * 60 ))
