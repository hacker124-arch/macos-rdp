name: Build whpx_firmware.exe (Windows)

# Builds the Windows firmware loader. The source is inside this workflow,
# so this single file is all you need in the repo.
# Run it from Actions -> Build whpx_firmware.exe -> Run workflow.
# Download the "whpx_firmware" artifact. Put whpx_firmware.exe next to
# OVMF_CODE.fd and OVMF_VARS.fd, then run it on a PC with
# "Windows Hypervisor Platform" turned on.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Compile whpx_firmware.exe
    runs-on: windows-2022
    steps:
      - name: Write the source file
        shell: pwsh
        run: |
          @'
          // whpx_firmware.cpp
          // Quantum VM engine: loads UEFI firmware (OVMF_CODE.fd + OVMF_VARS.fd) into a WHPX
          // virtual machine, runs it from the firmware reset address, and sends the screen to
          // the Quantum VM app.
          //
          // Output (stdout, binary): one frame after another. Each frame is:
          //   "QVMF" (4 bytes), width (u32 little endian), height (u32 little endian),
          //   then width * height * 4 bytes of pixels (BGRA, 32 bits per pixel).
          // Log messages go to stderr.
          //
          // Build (x64 Native Tools Command Prompt for VS 2022):
          //   cl /EHsc /std:c++17 whpx_firmware.cpp WinHvPlatform.lib
          // Run:
          //   whpx_firmware.exe OVMF_CODE.fd OVMF_VARS.fd
          //   whpx_firmware.exe --test-pattern      (moving test picture, no VM)

          #include <windows.h>
          #include <WinHvPlatform.h>
          #include <fcntl.h>
          #include <io.h>

          #include <atomic>
          #include <chrono>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <fstream>
          #include <iterator>
          #include <set>
          #include <string>
          #include <thread>
          #include <vector>

          #define LOG(...) std::fprintf(stderr, __VA_ARGS__)

          #define CHECK(hr, what)                                                    \
              do {                                                                   \
                  HRESULT _h = (hr);                                                 \
                  if (FAILED(_h)) {                                                  \
                      LOG("%s failed: 0x%08lX\n", what, (unsigned long)_h);          \
                      return 1;                                                      \
                  }                                                                  \
              } while (0)

          static const UINT64 RAM_SIZE = 256ULL * 1024 * 1024;   // guest RAM at address 0
          static const UINT64 FOUR_GB = 0x100000000ULL;          // firmware ends at the top of 4 GB
          static const UINT64 SCREEN_OFFSET = 0x0E000000ULL;     // where the screen lives in guest RAM
          static const UINT32 SCREEN_W = 1024;
          static const UINT32 SCREEN_H = 768;
          static const size_t SCREEN_BYTES = static_cast<size_t>(SCREEN_W) * SCREEN_H * 4;
          static const int FRAME_MS = 66;                        // about 15 frames per second

          static std::atomic<bool> g_running{true};

          static bool ReadWholeFile(const std::string& path, std::vector<uint8_t>& out) {
              std::ifstream f(path, std::ios::binary);
              if (!f) return false;
              out.assign(std::istreambuf_iterator<char>(f), std::istreambuf_iterator<char>());
              return !out.empty();
          }

          static HRESULT SetReg64(WHV_PARTITION_HANDLE part, WHV_REGISTER_NAME name, UINT64 value) {
              WHV_REGISTER_VALUE v = {};
              v.Reg64 = value;
              return WHvSetVirtualProcessorRegisters(part, 0, &name, 1, &v);
          }

          // Values the firmware reads from ports we do not emulate yet.
          static UINT32 ReadPort(UINT16 port) {
              switch (port) {
                  case 0x3FD: return 0x60;            // COM1 line status: transmitter empty and ready
                  case 0x3FA: return 0x01;            // COM1 interrupt status: nothing pending
                  case 0x0092: return 0x02;           // system control port: A20 gate enabled
                  default:    return 0xFFFFFFFF;      // "no device here" (reads back all ones)
              }
          }

          static void PutU32(uint8_t* p, UINT32 v) {
              p[0] = v & 0xFF;
              p[1] = (v >> 8) & 0xFF;
              p[2] = (v >> 16) & 0xFF;
              p[3] = (v >> 24) & 0xFF;
          }

          // QEMU firmware config (ports 0x510 / 0x511). OVMF reads these items at startup.
          // Item 0x0000 is the signature, 0x0001 the feature bits (none), 0x0003 the RAM size,
          // 0x0019 the file count (none). Unknown items read as empty.
          static std::vector<uint8_t> FwCfgItem(UINT16 key) {
              std::vector<uint8_t> v;
              switch (key) {
                  case 0x0000: v = {'Q', 'E', 'M', 'U'}; break;
                  case 0x0001: v.assign(4, 0); break;
                  case 0x0003:
                      v.assign(8, 0);
                      for (int i = 0; i < 8; ++i) v[i] = static_cast<uint8_t>(RAM_SIZE >> (8 * i));
                      break;
                  case 0x0019: v.assign(4, 0); break;
                  default: break;
              }
              return v;
          }

          // Prints the main registers, so we can see what the code at RIP was doing.
          static void DumpRegisters(WHV_PARTITION_HANDLE part) {
              const WHV_REGISTER_NAME names[] = {
                  WHvX64RegisterRax, WHvX64RegisterRcx, WHvX64RegisterRsi, WHvX64RegisterRdi,
                  WHvX64RegisterRsp, WHvX64RegisterCr0, WHvX64RegisterCr3, WHvX64RegisterCr4,
                  WHvX64RegisterEfer, WHvX64RegisterCs, WHvX64RegisterCr2,
              };
              WHV_REGISTER_VALUE v[11] = {};
              if (FAILED(WHvGetVirtualProcessorRegisters(part, 0, names, 11, v))) {
                  LOG("[could not read registers]\n");
                  return;
              }
              LOG("[rax %llX rcx %llX rsi %llX rdi %llX rsp %llX]\n",
                  (unsigned long long)v[0].Reg64, (unsigned long long)v[1].Reg64,
                  (unsigned long long)v[2].Reg64, (unsigned long long)v[3].Reg64,
                  (unsigned long long)v[4].Reg64);
              LOG("[cr0 %llX cr3 %llX cr4 %llX efer %llX cs base %llX]\n",
                  (unsigned long long)v[5].Reg64, (unsigned long long)v[6].Reg64,
                  (unsigned long long)v[7].Reg64, (unsigned long long)v[8].Reg64,
                  (unsigned long long)v[9].Segment.Base);
              LOG("[cr2 (last page fault address) %llX]\n", (unsigned long long)v[10].Reg64);
          }

          // Prints the 16 bytes of guest memory at an address, so we can see the code that stopped.
          static void DumpBytes(const uint8_t* ram, UINT64 address) {
              if (address + 16 > RAM_SIZE) {
                  LOG("[RIP is outside guest RAM]\n");
                  return;
              }
              LOG("[bytes at RIP:");
              for (int i = 0; i < 16; ++i) LOG(" %02X", ram[address + i]);
              LOG("]\n");
          }

          // A frame is the header followed by the pixels. The header is written once.
          static std::vector<uint8_t> MakeFrame() {
              std::vector<uint8_t> frame(12 + SCREEN_BYTES, 0);
              std::memcpy(frame.data(), "QVMF", 4);
              PutU32(frame.data() + 4, SCREEN_W);
              PutU32(frame.data() + 8, SCREEN_H);
              return frame;
          }

          static void SendFrame(std::vector<uint8_t>& frame, const uint8_t* pixels) {
              std::memcpy(frame.data() + 12, pixels, SCREEN_BYTES);
              std::fwrite(frame.data(), 1, frame.size(), stdout);
              std::fflush(stdout);
          }

          // Sends the screen from guest memory until the VM stops.
          static void ScreenLoop(const uint8_t* ram) {
              std::vector<uint8_t> frame = MakeFrame();
              while (g_running) {
                  SendFrame(frame, ram + SCREEN_OFFSET);
                  std::this_thread::sleep_for(std::chrono::milliseconds(FRAME_MS));
              }
          }

          // Test picture: a moving gradient, so the display can be checked without a VM.
          static int TestPattern() {
              std::vector<uint8_t> frame = MakeFrame();
              std::vector<uint8_t> pixels(SCREEN_BYTES);
              for (uint32_t t = 0;; ++t) {
                  for (uint32_t y = 0; y < SCREEN_H; ++y) {
                      for (uint32_t x = 0; x < SCREEN_W; ++x) {
                          uint8_t* p = &pixels[(static_cast<size_t>(y) * SCREEN_W + x) * 4];
                          p[0] = static_cast<uint8_t>(x);            // blue
                          p[1] = static_cast<uint8_t>(y);            // green
                          p[2] = static_cast<uint8_t>(x + t * 2);    // red
                          p[3] = 0;
                      }
                  }
                  SendFrame(frame, pixels.data());
                  std::this_thread::sleep_for(std::chrono::milliseconds(FRAME_MS));
              }
              return 0;
          }

          // Runs the virtual CPU until the guest stops. Returns 0 on a normal stop, 1 on error.
          static int RunLoop(WHV_PARTITION_HANDLE part, const uint8_t* ram) {
              std::set<UINT16> unknownPorts;
              UINT16 fwSelector = 0;
              UINT32 fwOffset = 0;
              std::vector<uint8_t> fwItem = FwCfgItem(0);
              LOG("Starting firmware...\n");
              for (;;) {
                  WHV_RUN_VP_EXIT_CONTEXT exit = {};
                  CHECK(WHvRunVirtualProcessor(part, 0, &exit, sizeof(exit)), "WHvRunVirtualProcessor");

                  if (exit.ExitReason == WHvRunVpExitReasonX64IoPortAccess) {
                      const auto& io = exit.IoPortAccess;
                      const UINT16 port = io.PortNumber;
                      const UINT32 size = io.AccessInfo.AccessSize;   // 1, 2 or 4 bytes
                      const UINT64 mask = size == 1 ? 0xFFULL : size == 2 ? 0xFFFFULL : 0xFFFFFFFFULL;

                      if (io.AccessInfo.IsWrite) {
                          if (port == 0x3F8) {
                              std::fputc(static_cast<int>(io.Rax & 0xFF), stderr);   // serial output goes to the log
                          } else if (port == 0x0510) {
                              fwSelector = static_cast<UINT16>(io.Rax & 0xFFFF);
                              fwOffset = 0;
                              fwItem = FwCfgItem(fwSelector);
                          } else if (port == 0x80 || port == 0x0092) {
                              // ignored: debug port and system control port
                          } else if (unknownPorts.insert(port).second) {
                              LOG("\n[note] write to unhandled port 0x%04X\n", port);
                          }
                      } else {
                          UINT64 value;
                          if (port == 0x0511) {
                              value = fwOffset < fwItem.size() ? fwItem[fwOffset] : 0;
                              ++fwOffset;
                          } else {
                              value = ReadPort(port);
                          }
                          if (port != 0x3FD && port != 0x3FA && port != 0x0511 && port != 0x0092 &&
                              unknownPorts.insert(port).second)
                              LOG("\n[note] read from unhandled port 0x%04X\n", port);
                          UINT64 newRax = (io.Rax & ~mask) | (value & mask);
                          CHECK(SetReg64(part, WHvX64RegisterRax, newRax), "set RAX");
                      }

                      // Move past the IN/OUT instruction so it is not run again.
                      CHECK(SetReg64(part, WHvX64RegisterRip,
                                     exit.VpContext.Rip + exit.VpContext.InstructionLength),
                            "advance RIP");

                  } else if (exit.ExitReason == WHvRunVpExitReasonMemoryAccess) {
                      LOG("\n[stop] firmware accessed unmapped address 0x%llX at RIP 0x%llX\n",
                          (unsigned long long)exit.MemoryAccess.Gpa,
                          (unsigned long long)exit.VpContext.Rip);
                      return 0;

                  } else if (exit.ExitReason == WHvRunVpExitReasonX64Halt) {
                      LOG("\n[guest halted at RIP 0x%llX]\n", (unsigned long long)exit.VpContext.Rip);
                      return 0;

                  } else if (exit.ExitReason == WHvRunVpExitReasonException) {
                      LOG("\n[stop] guest exception %u, error code 0x%X, parameter 0x%llX, RIP 0x%llX\n",
                          (unsigned)exit.VpException.ExceptionType, (unsigned)exit.VpException.ErrorCode,
                          (unsigned long long)exit.VpException.ExceptionParameter,
                          (unsigned long long)exit.VpContext.Rip);
                      DumpRegisters(part);
                      DumpBytes(ram, exit.VpContext.Rip);
                      return 0;

                  } else if (exit.ExitReason == WHvRunVpExitReasonUnrecoverableException) {
                      LOG("\n[stop] unrecoverable exception (guest faulted and could not recover) at RIP 0x%llX\n",
                          (unsigned long long)exit.VpContext.Rip);
                      DumpRegisters(part);
                      DumpBytes(ram, exit.VpContext.Rip);
                      return 0;

                  } else {
                      LOG("\n[stop] unexpected VM exit, reason %d, RIP 0x%llX\n",
                          (int)exit.ExitReason, (unsigned long long)exit.VpContext.Rip);
                      DumpRegisters(part);
                      DumpBytes(ram, exit.VpContext.Rip);
                      return 0;
                  }
              }
          }

          int main(int argc, char** argv) {
              // Frames are binary data on stdout. Log text goes to stderr, so the two never mix.
              _setmode(_fileno(stdout), _O_BINARY);

              if (argc > 1 && std::strcmp(argv[1], "--test-pattern") == 0)
                  return TestPattern();

              std::string codePath = argc > 1 ? argv[1] : "OVMF_CODE.fd";
              std::string varsPath = argc > 2 ? argv[2] : "OVMF_VARS.fd";

              // 1. Load the firmware files.
              std::vector<uint8_t> code, vars;
              if (!ReadWholeFile(codePath, code)) { LOG("Cannot read %s\n", codePath.c_str()); return 1; }
              if (!ReadWholeFile(varsPath, vars)) { LOG("Cannot read %s\n", varsPath.c_str()); return 1; }
              LOG("Firmware code: %s (%zu bytes)\n", codePath.c_str(), code.size());
              LOG("Firmware vars: %s (%zu bytes)\n", varsPath.c_str(), vars.size());

              // The code image sits at the top of the first 4 GB, so its last byte is at 0xFFFFFFFF.
              // The variable store goes just below it.
              const UINT64 codeBase = FOUR_GB - code.size();
              const UINT64 varsBase = codeBase - vars.size();
              LOG("Code at 0x%llX, vars at 0x%llX\n",
                  (unsigned long long)codeBase, (unsigned long long)varsBase);

              // 2. Create the VM with one virtual CPU.
              WHV_PARTITION_HANDLE part = nullptr;
              CHECK(WHvCreatePartition(&part), "WHvCreatePartition");

              UINT32 cpus = 1;
              CHECK(WHvSetPartitionProperty(part, WHvPartitionPropertyCodeProcessorCount,
                                            &cpus, sizeof(cpus)),
                    "set CPU count");

              // Let Windows emulate the local APIC. If this fails, the program keeps going.
              WHV_X64_LOCAL_APIC_EMULATION_MODE apic = WHvX64LocalApicEmulationModeXApic;
              HRESULT apicHr = WHvSetPartitionProperty(part, WHvPartitionPropertyCodeLocalApicEmulationMode,
                                                       &apic, sizeof(apic));
              if (FAILED(apicHr))
                  LOG("Note: APIC emulation not enabled (0x%08lX)\n", (unsigned long)apicHr);

              // Ask Windows to stop the VM on page faults (exception vector 14), so we see the address.
              UINT64 exceptionBitmap = 1ULL << 14;
              HRESULT excHr = WHvSetPartitionProperty(part, WHvPartitionPropertyCodeExceptionExitBitmap,
                                                      &exceptionBitmap, sizeof(exceptionBitmap));
              if (FAILED(excHr))
                  LOG("Note: page fault reporting not enabled (0x%08lX)\n", (unsigned long)excHr);

              CHECK(WHvSetupPartition(part), "WHvSetupPartition");

              // 3. Map memory: RAM, the firmware code (read + execute) and the variable store.
              void* ram = VirtualAlloc(nullptr, RAM_SIZE, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
              void* codeMem = VirtualAlloc(nullptr, code.size(), MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
              void* varsMem = VirtualAlloc(nullptr, vars.size(), MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
              if (!ram || !codeMem || !varsMem) { LOG("VirtualAlloc failed\n"); return 1; }
              std::memcpy(codeMem, code.data(), code.size());
              std::memcpy(varsMem, vars.data(), vars.size());

              const auto rwx = static_cast<WHV_MAP_GPA_RANGE_FLAGS>(WHvMapGpaRangeFlagRead | WHvMapGpaRangeFlagWrite | WHvMapGpaRangeFlagExecute);
              const auto rw = static_cast<WHV_MAP_GPA_RANGE_FLAGS>(WHvMapGpaRangeFlagRead | WHvMapGpaRangeFlagWrite);
              CHECK(WHvMapGpaRange(part, ram, 0, RAM_SIZE, rwx), "map RAM");
              CHECK(WHvMapGpaRange(part, codeMem, codeBase, code.size(), rwx), "map firmware code");
              CHECK(WHvMapGpaRange(part, varsMem, varsBase, vars.size(), rw), "map firmware vars");

              // 4. Create the CPU and start it at the x86 reset vector (0xFFFFFFF0),
              //    in the same state a real PC uses after power-on.
              CHECK(WHvCreateVirtualProcessor(part, 0, 0), "WHvCreateVirtualProcessor");

              auto segment = [](UINT64 base, UINT16 selector, UINT16 attributes) {
                  WHV_X64_SEGMENT_REGISTER s = {};
                  s.Base = base;
                  s.Limit = 0xFFFF;
                  s.Selector = selector;
                  s.Attributes = attributes;
                  return s;
              };

              WHV_REGISTER_NAME names[] = {
                  WHvX64RegisterCs, WHvX64RegisterDs, WHvX64RegisterEs, WHvX64RegisterSs,
                  WHvX64RegisterCr0, WHvX64RegisterRflags, WHvX64RegisterRip,
              };
              WHV_REGISTER_VALUE values[7] = {};
              values[0].Segment = segment(0xFFFF0000ULL, 0xF000, 0x9B);  // CS = reset segment
              values[1].Segment = segment(0, 0, 0x93);                   // DS
              values[2].Segment = segment(0, 0, 0x93);                   // ES
              values[3].Segment = segment(0, 0, 0x93);                   // SS
              values[4].Reg64 = 0x60000010;   // CR0: real mode, caches disabled (power-on state)
              values[5].Reg64 = 0x2;          // RFLAGS
              values[6].Reg64 = 0xFFF0;       // RIP: reset vector (CS base + RIP = 0xFFFFFFF0)
              CHECK(WHvSetVirtualProcessorRegisters(part, 0, names, 7, values), "set reset registers");

              // 5. Send the screen to the app while the firmware runs.
              std::thread screen(ScreenLoop, static_cast<const uint8_t*>(ram));
              int result = RunLoop(part, static_cast<const uint8_t*>(ram));
              g_running = false;
              screen.join();

              // 6. Clean up.
              WHvDeletePartition(part);
              VirtualFree(ram, 0, MEM_RELEASE);
              VirtualFree(codeMem, 0, MEM_RELEASE);
              VirtualFree(varsMem, 0, MEM_RELEASE);
              return result;
          }
          '@ | Set-Content -Encoding ascii whpx_firmware.cpp

      - name: Set up the Visual C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        shell: cmd
        run: cl /EHsc /std:c++17 whpx_firmware.cpp WinHvPlatform.lib /Fe:whpx_firmware.exe

      - name: Show the file
        shell: pwsh
        run: Get-Item whpx_firmware.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: whpx_firmware
          path: whpx_firmware.exe
          if-no-files-found: error
