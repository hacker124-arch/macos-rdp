name: macos-vm
on: workflow_dispatch
jobs:
  vm:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Enable VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "${{ secrets.VNC_PASSWORD }}" \
            -restart -agent -privs -all
          sudo dscl . -passwd /Users/runner "${{ secrets.VNC_PASSWORD }}"
      - name: Start ngrok
        run: |
          brew install ngrok
          ngrok config add-authtoken "${{ secrets.NGROK_TOKEN }}"
          ngrok tcp 5900 --log=stdout > ngrok.log &
          sleep 10
          curl -s localhost:4040/api/tunnels | grep -o 'tcp://[^"]*'
      - name: Keep alive
        run: sleep 21000
