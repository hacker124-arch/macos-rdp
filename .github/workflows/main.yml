name: Build Quantum VM (QEMU engine + APK)

# How to use: push this project to a GitHub repo (project files at the repo root),
# open the Actions tab, pick "Build Quantum VM", click "Run workflow".
# When it finishes, download the artifact "QuantumVM-apk" (installable app with the
# engine inside) or "quantumvm-engine" (just the engine files).

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  engine:
    name: Fetch and repackage QEMU engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y patchelf binutils xz-utils

      - name: Write packaging script
        run: |
          cat > "$RUNNER_TEMP/fetch_engine.py" <<'PY'
          import gzip, lzma, os, re, shutil, subprocess, sys, urllib.request
          from pathlib import Path

          BASE = "https://packages.termux.dev/apt/termux-main/"
          INDEX = BASE + "dists/stable/main/binary-aarch64/Packages"
          PREFIX = "data/data/com.termux/files/usr"
          OUT = Path(sys.argv[1]).resolve()
          WORK = Path(sys.argv[2]).resolve()
          LIBDIR = OUT / "jniLibs" / "arm64-v8a"
          ASSETDIR = OUT / "assets" / "qemu"

          # Libraries Android itself provides; never bundled.
          SYSTEM = {
              "libc.so", "libm.so", "libdl.so", "liblog.so", "libz.so", "libandroid.so",
              "libEGL.so", "libGLESv1_CM.so", "libGLESv2.so", "libGLESv3.so", "libvulkan.so",
              "libOpenSLES.so", "libnativewindow.so", "libjnigraphics.so", "libstdc++.so",
          }


          def fetch(url, dest=None):
              req = urllib.request.Request(url, headers={"User-Agent": "quantumvm-build"})
              with urllib.request.urlopen(req, timeout=300) as r:
                  data = r.read()
              if dest:
                  Path(dest).parent.mkdir(parents=True, exist_ok=True)
                  Path(dest).write_bytes(data)
              return data


          def load_index():
              for suffix, opener in ((".xz", lzma.decompress), (".gz", gzip.decompress), ("", lambda b: b)):
                  try:
                      return opener(fetch(INDEX + suffix)).decode("utf-8", "replace")
                  except Exception as e:  # noqa
                      print("package index", suffix or "(plain)", "failed:", e)
              sys.exit("Could not download the Termux package index")


          def parse_index(text):
              pkgs = {}
              for block in text.split("\n\n"):
                  f = {}
                  for line in block.splitlines():
                      if line.startswith((" ", "\t")) or ":" not in line:
                          continue
                      k, v = line.split(":", 1)
                      f[k.strip()] = v.strip()
                  if "Package" in f and "Filename" in f:
                      pkgs[f["Package"]] = f
              return pkgs


          def dep_names(pkg):
              out = []
              for part in pkg.get("Depends", "").split(","):
                  part = part.strip()
                  if not part:
                      continue
                  first = part.split("|")[0]
                  first = re.sub(r"\(.*?\)", "", first).strip()
                  if first:
                      out.append(first)
              return out


          def pick(pkgs, *names):
              for n in names:
                  if n in pkgs:
                      return n
              sys.exit("None of these packages exist in the Termux index: %s" % (names,))


          def readelf(path):
              return subprocess.run(["readelf", "-d", str(path)], capture_output=True, text=True).stdout


          def needed(path):
              return re.findall(r"\(NEEDED\)\s+Shared library: \[(.+?)\]", readelf(path))


          def soname(path):
              m = re.search(r"\(SONAME\)\s+Library soname: \[(.+?)\]", readelf(path))
              return m.group(1) if m else None


          def android_name(n):
              """Android only packages files named lib*.so, so rename libfoo.so.1.2 -> libfoo_1_2.so."""
              if n.endswith(".so"):
                  return n
              base, _, suffix = n.partition(".so")
              suffix = suffix.strip(".").replace(".", "_")
              return "%s_%s.so" % (base, suffix) if suffix else base + ".so"


          def candidates(n):
              """Guess Termux package names that could provide a library file name."""
              base = n.split(".so")[0]                      # libzstd, libglib-2.0, libpcre2-8
              trimmed = re.sub(r"[-_.]?\d+(\.\d+)*$", "", base)
              out = []
              for b in (base, trimmed):
                  bare = b[3:] if b.startswith("lib") else b
                  out += [b, "lib" + bare, bare]
              seen = set()
              return [c for c in out if c and not (c in seen or seen.add(c))]


          def main():
              pkgs = parse_index(load_index())
              print("Termux index has", len(pkgs), "packages")
              roots = [
                  pick(pkgs, "qemu-system-x86-64-headless", "qemu-system-x86-64"),
                  pick(pkgs, "qemu-system-aarch64-headless", "qemu-system-aarch64"),
                  pick(pkgs, "qemu-utils"),
                  pick(pkgs, "qemu-common"),
              ]
              print("Root packages:", roots)

              root = WORK / "root"
              root.mkdir(parents=True, exist_ok=True)
              installed = set()

              def install(names):
                  stack = list(names)
                  while stack:
                      n = stack.pop()
                      if n in installed:
                          continue
                      installed.add(n)
                      if n not in pkgs:
                          print("  (skipping unknown/virtual dependency:", n + ")")
                          continue
                      deb = WORK / "debs" / Path(pkgs[n]["Filename"]).name
                      fetch(BASE + pkgs[n]["Filename"], deb)
                      subprocess.run(["dpkg-deb", "-x", str(deb), str(root)], check=True)
                      stack.extend(dep_names(pkgs[n]))

              install(roots)
              print("Installed", len(installed), "packages")

              usr = root / PREFIX
              binaries = {
                  "libqemu-system-x86_64.so": usr / "bin" / "qemu-system-x86_64",
                  "libqemu-system-aarch64.so": usr / "bin" / "qemu-system-aarch64",
                  "libqemu-img.so": usr / "bin" / "qemu-img",
              }
              for out_name, src in binaries.items():
                  if not src.exists():
                      print("Files in", usr / "bin", ":", sorted(p.name for p in (usr / "bin").glob("qemu*")))
                      sys.exit("Missing binary: %s" % src)

              def index_libs():
                  idx = {}
                  for p in (usr / "lib").rglob("*"):
                      if ".so" in p.name and (p.is_file() or p.is_symlink()):
                          real = Path(os.path.realpath(p))
                          if real.is_file():
                              idx[p.name] = real
                  return idx

              def closure(libindex):
                  include, unresolved = {}, set()
                  queue = list(binaries.values())
                  while queue:
                      cur = queue.pop()
                      for n in needed(cur):
                          if n in include or n in SYSTEM:
                              continue
                          if n in libindex:
                              include[n] = libindex[n]
                              queue.append(libindex[n])
                          else:
                              unresolved.add(n)
                  return include, unresolved

              # Termux's dependency lists are not always complete, so keep installing the package
              # behind any library that is still missing until everything resolves.
              for _ in range(12):
                  libindex = index_libs()
                  include, unresolved = closure(libindex)
                  if not unresolved:
                      break
                  progress = False
                  for n in sorted(unresolved):
                      for cand in candidates(n):
                          if cand in pkgs and cand not in installed:
                              print("  installing", cand, "to provide", n)
                              install([cand])
                              progress = True
                              break
                  if not progress:
                      break
              if unresolved:
                  sys.exit("UNRESOLVED libraries (not in any package I could find): %s" % sorted(unresolved))

              # decide final file names (one file per real library)
              final_of_real = {}
              for n, real in include.items():
                  if real not in final_of_real:
                      final_of_real[real] = android_name(soname(real) or n)
              seen_final = {}
              for real, fin in final_of_real.items():
                  if fin in seen_final and seen_final[fin] != real:
                      sys.exit("Name collision for %s" % fin)
                  seen_final[fin] = real
              final_for_needed = {n: final_of_real[real] for n, real in include.items()}

              if OUT.exists():
                  shutil.rmtree(OUT)
              LIBDIR.mkdir(parents=True)
              ASSETDIR.mkdir(parents=True)

              def patch(dest, is_lib, final_name=None):
                  args = ["patchelf", "--set-rpath", "$ORIGIN"]
                  if is_lib:
                      args += ["--set-soname", final_name]
                  for n in needed(dest):
                      tgt = final_for_needed.get(n)
                      if tgt and tgt != n:
                          args += ["--replace-needed", n, tgt]
                  args.append(str(dest))
                  subprocess.run(args, check=True)

              for out_name, src in binaries.items():
                  dest = LIBDIR / out_name
                  shutil.copy2(src, dest)
                  patch(dest, False)
              for real, fin in final_of_real.items():
                  dest = LIBDIR / fin
                  shutil.copy2(real, dest)
                  patch(dest, True, fin)

              # firmware / BIOS files (flat files only; the app copies them to storage)
              share = usr / "share" / "qemu"
              count = 0
              if share.is_dir():
                  for p in sorted(share.iterdir()):
                      real = Path(os.path.realpath(p))
                      if real.is_file() and real.stat().st_size < 100 * 1024 * 1024:
                          shutil.copy2(real, ASSETDIR / p.name)
                          count += 1
                  km = share / "keymaps"
                  if km.is_dir():
                      (ASSETDIR / "keymaps").mkdir()
                      for kp in sorted(km.iterdir()):
                          kreal = Path(os.path.realpath(kp))
                          if kreal.is_file():
                              shutil.copy2(kreal, ASSETDIR / "keymaps" / kp.name)
                      print("Keymaps copied:", len(list((ASSETDIR / "keymaps").iterdir())))
                  else:
                      print("WARNING: no keymaps folder found in the Termux packages")
              print("Firmware files copied:", count)

              # final check on the OUTPUT: every NEEDED name must be bundled or provided by Android
              present = {p.name for p in LIBDIR.iterdir()}
              problems = []
              for p in sorted(LIBDIR.iterdir()):
                  for n in needed(p):
                      if n not in present and n not in SYSTEM:
                          problems.append("%s needs %s" % (p.name, n))
              total = sum(p.stat().st_size for p in LIBDIR.iterdir()) / 1e6
              print("Engine files:", len(present), "files,", "%.1f MB" % total)
              for line in problems:
                  print("  PROBLEM:", line)
              (OUT / "MANIFEST.txt").write_text("\n".join(sorted(present)) + "\n")
              if problems:
                  sys.exit("Some bundled files still need libraries that are not bundled")


          main()
          PY

      - name: Build engine files
        run: python3 "$RUNNER_TEMP/fetch_engine.py" "$GITHUB_WORKSPACE/engine-out" "$RUNNER_TEMP/work"

      - name: Show result
        run: |
          ls -la engine-out/jniLibs/arm64-v8a | head -60
          ls engine-out/assets/qemu | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: quantumvm-engine
          path: engine-out
          if-no-files-found: error

  apk:
    name: Build the Quantum VM APK
    needs: engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quantumvm-engine
          path: engine-out

      - name: Generate the Quantum VM project from this workflow
        run: |
          set -e
          mkdir -p qvm
          cd qvm
          cat > settings.gradle.kts <<'QVM_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "QuantumVM"
          include(":app")
          QVM_EOF
          cat > build.gradle.kts <<'QVM_EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          QVM_EOF
          cat > gradle.properties <<'QVM_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          QVM_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'QVM_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.quantumvm.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.quantumvm.app"
                  minSdk = 33          // Android 13
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += "arm64-v8a" }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }

              packaging {
                  // QEMU binaries live in jniLibs as lib*.so and must be extracted
                  // to nativeLibraryDir so they can be executed.
                  jniLibs { useLegacyPackaging = true }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              // Web gateway for Servers (login page + WebSocket bridge to the VM display)
              implementation("org.nanohttpd:nanohttpd:2.3.1")
              implementation("org.nanohttpd:nanohttpd-websocket:2.3.1")
          }
          QVM_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'QVM_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.QuantumVM">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".engine.VmService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Runs user-created virtual machines with the bundled QEMU engine" />
                  </service>
              </application>
          </manifest>
          QVM_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'QVM_EOF'
          <resources>
              <string name="app_name">Quantum VM</string>
          </resources>
          QVM_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'QVM_EOF'
          <resources>
              <style name="Theme.QuantumVM" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#120A1F</item>
                  <item name="android:statusBarColor">#120A1F</item>
                  <item name="android:navigationBarColor">#120A1F</item>
              </style>
          </resources>
          QVM_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'QVM_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1B0F33"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          QVM_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'QVM_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Outer chip -->
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#C9A7FF"
                  android:strokeWidth="4"
                  android:pathData="M34,34h40v40h-40z" />
              <!-- Inner core -->
              <path
                  android:fillColor="#9B5CFF"
                  android:pathData="M45,45h18v18h-18z" />
              <!-- Pins -->
              <path
                  android:strokeColor="#C9A7FF"
                  android:strokeWidth="3"
                  android:pathData="M44,28v6M54,28v6M64,28v6M44,74v6M54,74v6M64,74v6M28,44h6M28,54h6M28,64h6M74,44h6M74,54h6M74,64h6" />
          </vector>
          QVM_EOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'QVM_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          QVM_EOF
          mkdir -p app/src/main/assets/web
          cat > app/src/main/assets/web/login.html <<'QVM_EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Quantum VM</title>
          <style>
            :root { --bg:#120a1f; --surf:#1b0f33; --hi:#2a1850; --pri:#9b5cff; --lt:#c9a7ff; --txt:#ede3ff; --mut:#9d8bbf; --err:#ff6b8b; }
            * { box-sizing: border-box; }
            body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
                   background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
            .card { width:min(92vw,380px); background:var(--surf); border:1px solid var(--hi); border-radius:20px; padding:28px; }
            h1 { margin:0 0 4px; font-size:24px; color:var(--lt); }
            p { margin:0 0 20px; color:var(--mut); font-size:14px; }
            label { display:block; font-size:13px; color:var(--mut); margin:14px 0 6px; }
            input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--hi);
                    background:#0b0615; color:var(--txt); font-size:16px; }
            input:focus { outline:2px solid var(--pri); border-color:transparent; }
            button { width:100%; margin-top:22px; padding:13px; border:0; border-radius:12px;
                     background:var(--pri); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
            .err { color:var(--err); font-size:14px; margin-top:14px; display:none; }
          </style>
          </head>
          <body>
            <form class="card" method="post" action="/login">
              <h1>Quantum VM</h1>
              <p>Enter the credentials shown on your phone.</p>
              <label for="u">Username</label>
              <input id="u" name="u" autocomplete="username" autocapitalize="none" autocorrect="off" required>
              <label for="p">Password</label>
              <input id="p" name="p" type="password" autocomplete="current-password" required>
              <button type="submit">Connect</button>
              <div class="err" id="err"></div>
            </form>
          <script>
            const q = location.search;
            const e = document.getElementById('err');
            if (q.includes('e=1')) { e.textContent = 'Wrong username or password.'; e.style.display = 'block'; }
            if (q.includes('e=2')) { e.textContent = 'Too many attempts. Wait a minute and try again.'; e.style.display = 'block'; }
          </script>
          </body>
          </html>
          QVM_EOF
          mkdir -p app/src/main/assets/web
          cat > app/src/main/assets/web/viewer.html <<'QVM_EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <title>Quantum VM</title>
          <style>
            :root { --bg:#120a1f; --surf:#1b0f33; --hi:#2a1850; --pri:#9b5cff; --lt:#c9a7ff; --txt:#ede3ff; }
            html, body { margin:0; height:100%; background:var(--bg); color:var(--txt);
                         font-family:system-ui,-apple-system,Segoe UI,sans-serif; overflow:hidden; }
            #bar { display:flex; gap:8px; align-items:center; padding:8px 12px; height:52px; box-sizing:border-box;
                   background:var(--surf); border-bottom:1px solid var(--hi); }
            #bar b { color:var(--lt); }
            #status { margin-right:auto; font-size:13px; color:#9d8bbf; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
            button { background:var(--pri); color:#fff; border:0; border-radius:10px; padding:8px 12px; font-size:14px; cursor:pointer; }
            button.alt { background:var(--hi); color:var(--lt); }
            #stage { height:calc(100% - 52px); display:flex; align-items:center; justify-content:center; background:#0b0615; }
            canvas { max-width:100%; max-height:100%; touch-action:none; outline:none; background:#000; }
            #kb { position:fixed; left:-1000px; top:0; opacity:0; width:10px; height:10px; }
          </style>
          </head>
          <body>
          <div id="bar">
            <b>Quantum VM</b>
            <span id="status">Connecting...</span>
            <button class="alt" id="kbBtn">Keyboard</button>
            <button class="alt" id="cad">Ctrl+Alt+Del</button>
            <button class="alt" id="fs">Fullscreen</button>
          </div>
          <div id="stage"><canvas id="screen" width="640" height="400"></canvas></div>
          <textarea id="kb" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>

          <script>
          (() => {
            const canvas = document.getElementById('screen');
            const ctx = canvas.getContext('2d');
            const statusEl = document.getElementById('status');
            const kb = document.getElementById('kb');
            const touchMode = navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches;
            const setStatus = t => { statusEl.textContent = t; };

            // ---- byte queue with awaitable reads
            class Reader {
              constructor() { this.chunks = []; this.len = 0; this.waiter = null; }
              push(u8) {
                this.chunks.push(u8); this.len += u8.length;
                if (this.waiter && this.len >= this.waiter.n) {
                  const w = this.waiter; this.waiter = null; w.resolve(this.take(w.n));
                }
              }
              take(n) {
                const out = new Uint8Array(n); let o = 0;
                while (o < n) {
                  const c = this.chunks[0]; const k = Math.min(c.length, n - o);
                  out.set(c.subarray(0, k), o); o += k;
                  if (k === c.length) this.chunks.shift(); else this.chunks[0] = c.subarray(k);
                }
                this.len -= n; return out;
              }
              read(n) {
                if (this.len >= n) return Promise.resolve(this.take(n));
                return new Promise(resolve => { this.waiter = { n, resolve }; });
              }
            }

            let ws = null, ready = false, tries = 0;

            const send = bytes => { if (ws && ws.readyState === 1) ws.send(bytes); };
            const key = (down, sym) => send(Uint8Array.of(4, down ? 1 : 0, 0, 0,
                (sym >>> 24) & 255, (sym >>> 16) & 255, (sym >>> 8) & 255, sym & 255));
            const pointer = (mask, x, y) => { if (ready) send(Uint8Array.of(5, mask, x >> 8, x & 255, y >> 8, y & 255)); };
            const request = incremental => send(Uint8Array.of(3, incremental ? 1 : 0,
                0, 0, 0, 0, canvas.width >> 8, canvas.width & 255, canvas.height >> 8, canvas.height & 255));

            async function run(reader) {
              const td = new TextDecoder();
              await reader.read(12);                                  // server version
              send(new TextEncoder().encode('RFB 003.008\n'));
              const n = (await reader.read(1))[0];
              if (n === 0) {
                const l = new DataView((await reader.read(4)).buffer).getUint32(0);
                throw new Error(td.decode(await reader.read(l)));
              }
              const types = await reader.read(n);
              if (!types.includes(1)) throw new Error('Unsupported VNC security type');
              send(Uint8Array.of(1));
              const res = new DataView((await reader.read(4)).buffer).getUint32(0);
              if (res !== 0) throw new Error('VNC refused the connection');
              send(Uint8Array.of(1));                                 // shared session

              const si = new DataView((await reader.read(24)).buffer);
              canvas.width = si.getUint16(0); canvas.height = si.getUint16(2);
              await reader.read(si.getUint32(20));                    // desktop name

              // 32bpp, little-endian, R=16 G=8 B=0 -> bytes arrive as B,G,R,X
              send(Uint8Array.of(0, 0, 0, 0, 32, 24, 0, 1, 0, 255, 0, 255, 0, 255, 16, 8, 0, 0, 0, 0));
              // Raw (0) + DesktopSize (-223)
              send(Uint8Array.of(2, 0, 0, 2, 0, 0, 0, 0, 255, 255, 255, 33));
              ready = true; tries = 0;
              setStatus('Connected');
              request(false);

              for (;;) {
                const t = (await reader.read(1))[0];
                if (t === 0) {
                  const nr = new DataView((await reader.read(3)).buffer).getUint16(1);
                  let resized = false;
                  for (let i = 0; i < nr; i++) {
                    const h = new DataView((await reader.read(12)).buffer);
                    const x = h.getUint16(0), y = h.getUint16(2), w = h.getUint16(4), hh = h.getUint16(6), enc = h.getInt32(8);
                    if (enc === 0) {
                      const px = await reader.read(w * hh * 4);
                      const img = ctx.createImageData(w, hh); const d = img.data;
                      for (let a = 0; a < px.length; a += 4) {
                        d[a] = px[a + 2]; d[a + 1] = px[a + 1]; d[a + 2] = px[a]; d[a + 3] = 255;
                      }
                      ctx.putImageData(img, x, y);
                    } else if (enc === -223) {
                      canvas.width = w; canvas.height = hh; resized = true;
                    } else {
                      throw new Error('Unsupported encoding ' + enc);
                    }
                  }
                  request(!resized);
                } else if (t === 1) {
                  const h = new DataView((await reader.read(5)).buffer);
                  await reader.read(h.getUint16(3) * 6);
                } else if (t === 2) {
                  // bell: ignore
                } else if (t === 3) {
                  const l = new DataView((await reader.read(7)).buffer).getUint32(3);
                  await reader.read(l);
                } else {
                  throw new Error('Unknown server message ' + t);
                }
              }
            }

            function connect() {
              ready = false;
              const reader = new Reader();
              ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws', 'binary');
              ws.binaryType = 'arraybuffer';
              ws.onmessage = e => reader.push(new Uint8Array(e.data));
              ws.onopen = () => { run(reader).catch(err => setStatus('Error: ' + err.message)); };
              ws.onclose = () => {
                const wasReady = ready; ready = false;
                if (!wasReady && tries < 40) {
                  tries++; setStatus('Waiting for the VM to start... (' + tries + ')');
                  setTimeout(connect, 2000);
                } else {
                  setStatus('Disconnected. Reload the page to reconnect.');
                }
              };
            }

            // ---- keyboard
            const SPECIAL = { Backspace:0xFF08, Tab:0xFF09, Enter:0xFF0D, Escape:0xFF1B, Delete:0xFFFF, Home:0xFF50,
              ArrowLeft:0xFF51, ArrowUp:0xFF52, ArrowRight:0xFF53, ArrowDown:0xFF54, PageUp:0xFF55, PageDown:0xFF56,
              End:0xFF57, Insert:0xFF63, Shift:0xFFE1, Control:0xFFE3, Alt:0xFFE9, Meta:0xFFEB, CapsLock:0xFFE5 };
            function keysym(e) {
              if (SPECIAL[e.key]) {
                const base = SPECIAL[e.key];
                return (e.location === 2 && ['Shift', 'Control', 'Alt'].includes(e.key)) ? base + 1 : base;
              }
              if (/^F\d{1,2}$/.test(e.key)) return 0xFFBE + parseInt(e.key.slice(1), 10) - 1;
              if (e.key.length === 1) { const cp = e.key.codePointAt(0); return cp < 0x100 ? cp : 0x01000000 + cp; }
              return 0;
            }
            const pressed = new Map();
            const tap = s => { key(true, s); key(false, s); };

            window.addEventListener('keydown', e => {
              if (!ready) return;
              const s = keysym(e);
              if (!s) return;
              if (touchMode && e.key.length === 1) return;            // soft keyboard text arrives via 'input'
              e.preventDefault();
              if (e.repeat && pressed.has(e.code)) { key(true, s); return; }
              pressed.set(e.code, s); key(true, s);
            });
            window.addEventListener('keyup', e => {
              if (!ready) return;
              const s = pressed.get(e.code) || keysym(e);
              if (!s) return;
              e.preventDefault(); pressed.delete(e.code); key(false, s);
            });
            kb.addEventListener('input', e => {
              for (const ch of (e.data || kb.value)) {
                const cp = ch.codePointAt(0); tap(cp < 0x100 ? cp : 0x01000000 + cp);
              }
              kb.value = '';
            });
            window.addEventListener('blur', () => { pressed.forEach(s => key(false, s)); pressed.clear(); });

            // ---- pointer
            let mask = 0;
            function pos(e) {
              const r = canvas.getBoundingClientRect();
              const x = Math.max(0, Math.min(canvas.width - 1, Math.round((e.clientX - r.left) / r.width * canvas.width)));
              const y = Math.max(0, Math.min(canvas.height - 1, Math.round((e.clientY - r.top) / r.height * canvas.height)));
              return [x, y];
            }
            function pm(e) {
              const b = e.buttons;
              mask = (b & 1 ? 1 : 0) | (b & 4 ? 2 : 0) | (b & 2 ? 4 : 0);
              const [x, y] = pos(e); pointer(mask, x, y);
            }
            canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); e.preventDefault(); pm(e); });
            canvas.addEventListener('pointermove', pm);
            canvas.addEventListener('pointerup', pm);
            canvas.addEventListener('pointercancel', pm);
            canvas.addEventListener('contextmenu', e => e.preventDefault());
            canvas.addEventListener('wheel', e => {
              e.preventDefault();
              const [x, y] = pos(e); const bit = e.deltaY < 0 ? 8 : 16;
              pointer(mask | bit, x, y); pointer(mask, x, y);
            }, { passive: false });

            // ---- toolbar
            document.getElementById('kbBtn').onclick = () => kb.focus();
            document.getElementById('fs').onclick = () => {
              if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
            };
            document.getElementById('cad').onclick = () => {
              key(true, 0xFFE3); key(true, 0xFFE9); key(true, 0xFFFF);
              key(false, 0xFFFF); key(false, 0xFFE9); key(false, 0xFFE3);
            };

            connect();
          })();
          </script>
          </body>
          </html>
