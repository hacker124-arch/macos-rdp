          package com.quantumvm.app.data

          import android.content.Context
          import android.net.Uri
          import android.provider.OpenableColumns
          import java.io.File
          import java.util.UUID

          /** Stores each VM in filesDir/vms/<id>/ (config.json, disk.qcow2, optional boot.iso). */
          class VmRepository(private val context: Context) {

              private val root: File get() = File(context.filesDir, "vms").apply { mkdirs() }

              fun vmDir(id: String) = File(root, id).apply { mkdirs() }
              fun diskFile(id: String) = File(vmDir(id), "disk.qcow2")

              fun list(): List<VmConfig> =
                  root.listFiles()?.mapNotNull { dir ->
                      runCatching { VmConfig.fromJson(File(dir, "config.json").readText()) }.getOrNull()
                  }?.sortedBy { it.name.lowercase() } ?: emptyList()

              fun get(id: String): VmConfig? =
                  runCatching { VmConfig.fromJson(File(vmDir(id), "config.json").readText()) }.getOrNull()

              fun save(config: VmConfig) {
                  File(vmDir(config.id), "config.json").writeText(config.toJson())
              }

              fun delete(id: String) {
                  File(root, id).deleteRecursively()
              }

              fun newId(): String = UUID.randomUUID().toString().take(8)

              /** Copies a user-picked ISO into the VM folder so QEMU can open it by plain path. */
              fun importIso(id: String, uri: Uri): String {
                  val dest = File(vmDir(id), "boot.iso")
                  context.contentResolver.openInputStream(uri)?.use { input ->
                      dest.outputStream().use { input.copyTo(it) }
                  }
                  return dest.absolutePath
              }

              fun displayName(uri: Uri): String =
                  context.contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (c.moveToFirst() && i >= 0) c.getString(i) else null
                  } ?: "image.iso"
          }
