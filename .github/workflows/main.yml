          package com.quantumvm.app.engine

          import android.content.Context
          import com.quantumvm.app.data.VmConfig
          import com.quantumvm.app.data.VmRepository
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.launch
          import java.io.File
          import java.io.OutputStreamWriter

          /**
           * Wraps the bundled QEMU binaries. They ship inside the APK as lib*.so files in
           * jniLibs/arm64-v8a, so Android extracts them to nativeLibraryDir, the one place
           * an app is still allowed to execute files from on Android 10+.
           */
          object QemuEngine {

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private val processes = HashMap<String, Process>()
              private val writers = HashMap<String, OutputStreamWriter>()

              private val _running = MutableStateFlow<Set<String>>(emptySet())
              val running: StateFlow<Set<String>> = _running

              private val _logs = MutableStateFlow<Map<String, List<String>>>(emptyMap())
              val logs: StateFlow<Map<String, List<String>>> = _logs

              private const val MAX_LOG_LINES = 600

              fun nativeDir(context: Context) = File(context.applicationInfo.nativeLibraryDir)

              fun binaryFor(context: Context, vm: VmConfig) = File(nativeDir(context), vm.arch.qemuBinary)
              fun imgBinary(context: Context) = File(nativeDir(context), "libqemu-img.so")

              /** True when the QEMU binary for this guest architecture is bundled in the APK. */
              fun isEngineAvailable(context: Context, vm: VmConfig) = binaryFor(context, vm).exists()

              fun engineStatus(context: Context): List<Pair<String, Boolean>> =
                  listOf(
                      "qemu-system-x86_64" to File(nativeDir(context), "libqemu-system-x86_64.so").exists(),
                      "qemu-system-aarch64" to File(nativeDir(context), "libqemu-system-aarch64.so").exists(),
                      "qemu-img" to imgBinary(context).exists(),
                  )

              /** Copies the firmware files (BIOS, VGA ROMs, keymaps) from the qemu assets folder into filesDir/qemu once. */
              fun prepareFirmware(context: Context): File {
                  val out = File(context.filesDir, "qemu")
                  val marker = File(out, ".ready-v2")
                  if (marker.exists()) return out
                  out.mkdirs()
                  copyAssetTree(context, "qemu", out)
                  marker.writeText("1")
                  return out
              }

              private fun copyAssetTree(context: Context, assetPath: String, dest: File) {
                  val children = context.assets.list(assetPath)
                  if (children.isNullOrEmpty()) {
                      // a plain file
                      dest.parentFile?.mkdirs()
                      context.assets.open(assetPath).use { i -> dest.outputStream().use { i.copyTo(it) } }
                  } else {
                      dest.mkdirs()
                      children.forEach { copyAssetTree(context, "$assetPath/$it", File(dest, it)) }
                  }
              }

              fun buildCommand(
                  context: Context, vm: VmConfig, repo: VmRepository, firmwareDir: File,
                  vncPort: Int? = null,
              ): List<String> {
                  val cmd = mutableListOf(
                      binaryFor(context, vm).absolutePath,
                      "-L", firmwareDir.absolutePath,
                      "-machine", vm.arch.machine,
                      "-cpu", vm.arch.cpu,
                      "-accel", "tcg,thread=multi",
                      "-smp", vm.cpus.toString(),
                      "-m", vm.ramMb.toString(),
                      "-drive", "file=${repo.diskFile(vm.id).absolutePath},if=virtio,format=qcow2",
                      "-netdev", "user,id=net0",
                      "-device", "virtio-net-pci,netdev=net0",
                      "-serial", "stdio",
                      "-monitor", "none",
                  )
                  if (vncPort != null) {
                      // Server mode: graphical display on a loopback-only VNC port, which the
                      // authenticated web gateway (RemoteAccess) bridges to the browser.
                      cmd += listOf(
                          "-display", "none",
                          "-vnc", "127.0.0.1:${vncPort - 5900}",
                          "-device", "virtio-vga",
                          "-device", "qemu-xhci",
                          "-device", "usb-tablet",
                          "-device", "usb-kbd",
                      )
                  } else {
                      cmd += "-nographic"
                  }
                  vm.isoPath?.let { cmd += listOf("-cdrom", it, "-boot", "d") }
                  return cmd
              }

              fun createDisk(context: Context, vm: VmConfig, repo: VmRepository) {
                  val disk = repo.diskFile(vm.id)
                  if (disk.exists()) return
                  val img = imgBinary(context)
                  if (!img.exists()) error("libqemu-img.so is not bundled in the APK")
                  val p = ProcessBuilder(
                      img.absolutePath, "create", "-f", "qcow2", disk.absolutePath, "${vm.diskGb}G"
                  ).redirectErrorStream(true).start()
                  val out = p.inputStream.bufferedReader().readText()
                  if (p.waitFor() != 0) error("qemu-img failed: $out")
              }

              fun start(context: Context, vm: VmConfig, repo: VmRepository) {
                  if (vm.id in processes) return
                  // Reserve the slot immediately so a double tap can't launch two copies.
                  val session = RemoteAccess.start(
                      context, vm.id, local = !vm.isServer,
                      username = vm.serverUser, password = vm.serverPassword,
                  )
                  scope.launch {
                      try {
                          log(vm.id, "[Quantum VM] Starting ${vm.name}...")
                          if (!isEngineAvailable(context, vm)) {
                              log(vm.id, "[error] ${vm.arch.qemuBinary} is not bundled. See README.")
                              return@launch
                          }
                          createDisk(context, vm, repo)
                          val cmd = buildCommand(context, vm, repo, prepareFirmware(context), session.vncPort)
                          if (vm.isServer) log(vm.id, "[Quantum VM] Server address: ${session.url}")
                          log(vm.id, "$ " + cmd.joinToString(" "))
                          val pb = ProcessBuilder(cmd).redirectErrorStream(true)
                          // Bundled shared libraries sit next to the QEMU binaries.
                          pb.environment()["LD_LIBRARY_PATH"] = nativeDir(context).absolutePath
                          val p = pb.start()
                          synchronized(processes) {
                              processes[vm.id] = p
                              writers[vm.id] = OutputStreamWriter(p.outputStream)
                          }
                          _running.update { it + vm.id }
                          p.inputStream.bufferedReader().forEachLine { log(vm.id, it) }
                          val code = p.waitFor()
                          log(vm.id, "[Quantum VM] VM exited with code $code")
                      } catch (t: Throwable) {
                          log(vm.id, "[error] ${t.message}")
                      } finally {
                          RemoteAccess.stop(vm.id)
                          synchronized(processes) {
                              processes.remove(vm.id)
                              writers.remove(vm.id)
                          }
                          _running.update { it - vm.id }
                      }
                  }
              }

              fun stop(id: String) {
                  processes[id]?.destroy()
              }

              fun sendInput(id: String, line: String) {
                  scope.launch {
                      runCatching {
                          writers[id]?.apply { write(line + "\n"); flush() }
                      }
                  }
              }

              fun clearLog(id: String) = _logs.update { it - id }

              private fun log(id: String, line: String) {
                  _logs.update { map ->
                      val lines = (map[id] ?: emptyList()) + line
                      map + (id to lines.takeLast(MAX_LOG_LINES))
                  }
              }
          }
