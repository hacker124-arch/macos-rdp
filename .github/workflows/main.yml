name: macOS Remote Desktop

on:
  workflow_dispatch:

jobs:
  macos-rdp:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create User and Enable Screen Sharing
        run: |
          sudo dscl . -create /Users/runneradmin
          sudo dscl . -create /Users/runneradmin UserShell /bin/bash
          sudo dscl . -create /Users/runneradmin RealName "Runner Admin"
          sudo dscl . -create /Users/runneradmin UniqueID 501
          sudo dscl . -create /Users/runneradmin PrimaryGroupID 20
          sudo dscl . -passwd /Users/runneradmin P@ssw0rd!
          sudo createhomedir -u runneradmin -c
          sudo dseditgroup -o edit -a runneradmin -t user admin

          sudo mkdir -p /Library/Preferences
          echo "P@ssw0rd!" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_ = <>; chomp; s/^(.{8})./$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt
          
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users runneradmin -privs -all -restart -agent -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvnclegacy -vnclegacy yes
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

      - name: Start TCP Tunnel with Pinggy
        run: |
          ssh -p 443 -o StrictHostKeyChecking=no -R0:localhost:5900 tcp@free.pinggy.io &
          sleep 10
          while true; do sleep 30; done
